      PG_DATABASE: kyc
      # SPEC-W43 G-01: least-privilege app_kyc_login by default
      # (05-app-roles.sql); superuser only for migration/bootstrap jobs.
      DATABASE_URL: postgres://${KYC_PG_USER:-app_kyc_login}:${KYC_PG_PASS:-app_kyc_dev_password}@postgres:5432/kyc
      KYC_MOCK: ${KYC_MOCK:-0}  # W34 GF8: safe default off; DEV ONLY — mock resolver via explicit KYC_MOCK=1 (CRITICAL startup log)
      # Consent gate: identity GET /internal/consents/check (Dapr app-id
      # identity); empty = Dapr invoke via the sidecar.
      # SPEC-W44 F16: code reads IDENTITY_BASE_URL (config.go); the old
      # IDENTITY_URL key was dead config.
      IDENTITY_BASE_URL: ${IDENTITY_BASE_URL:-}
      # SPEC-W44 K2 caller side: the consent-gate call to identity
      # /internal/consents/check carries X-Internal-Token matching the
      # identity block's IDENTITY_INTERNAL_TOKEN (same DEV ONLY default;
      # prod MUST set via the secrets store, docs/runbooks/secrets.md).
      IDENTITY_INTERNAL_TOKEN: ${IDENTITY_INTERNAL_TOKEN:-opendesk-dev-identity-internal-token-change-in-prod}
      KYC_RESOLVED_TOPIC: opendesk.kyc.resolved.v1
    # GF4 (SPEC-W34): no host port published — backends are reachable only on the
    # opendesk docker network (inter-service by name) and through APISIX :9080.
    # Publishing bypassed gateway authN entirely (any host process could call the
    # service directly and self-assign identity headers).
    networks:
    - opendesk
    depends_on:
    - postgres
    - kafka
    - identity
  daprd-kyc:
    image: daprio/daprd:1.14.4
    command: *id001
    volumes: *id002
    networks: *id003
    environment:
      DAPR_APP_ID: kyc
      DAPR_APP_PORT: '7013'
  # SPEC-W33 §3 B2 credit-bureau (:7022) — F16-1: this service was an ORPHAN
  # (no compose entry, no gateway route). It is NOT part of the default
  # stack: profile-gated `experimental` (booking-service lending falls back
  # to its internal rule score when absent — WARN once per boot, per-call
  # debug). Start with: docker compose --profile experimental up -d credit-bureau
  # and uncomment the matching comment-gated route in infra/apisix/apisix.yaml.
  credit-bureau:
    build: ./services/credit-bureau
    profiles:
    - experimental
    environment:
      PORT: '7022'
      # Same JWT auth seam as graph-service: JWT_PUBLIC_KEY set => Bearer JWT
      # required; unset => dev mode (X-Tenant-Id header). Learned scorer stays
      # OFF unless CREDIT_ML_REGISTRY_DIR holds credit-ml-v{N} artifacts.
      JWT_PUBLIC_KEY: ${CREDIT_BUREAU_JWT_PUBLIC_KEY:-}
      CREDIT_ML_REGISTRY_DIR: ${CREDIT_ML_REGISTRY_DIR:-}
    # GF4 (SPEC-W34): no host port published — reachable only on the opendesk
    # network (booking -> CREDIT_BUREAU_URL=http://credit-bureau:7022).
    networks:
    - opendesk
volumes:
  ollama-models: null
