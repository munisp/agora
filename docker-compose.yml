name: agora
include:
- infra/docker-compose.core.yml
- infra/docker-compose.edge.yml
- infra/docker-compose.lakehouse.yml
- infra/docker-compose.crm.yml
- infra/docker-compose.observability.yml
networks:
  opendesk:
    driver: bridge
# ---------------------------------------------------------------------------
# DB CREDENTIAL POLICY (SPEC-W43 G-01, SEC#4/DATA#3): the opendesk/opendesk
# Postgres SUPERUSER is reserved for migration/bootstrap jobs only (schema
# DDL, pg_restore, billing migrations 0001-0004, service first-boot DDL that
# has not yet moved into infra/postgres/init-scripts). Every service that has
# a per-service role in infra/postgres/init-scripts/05-app-roles.sql connects
# with its least-privilege app_*_login role BY DEFAULT below (env-overridable
# via <SVC>_PG_USER/<SVC>_PG_PASS — see .env.example). Rationale: the
# superuser bypasses FORCE ROW LEVEL SECURITY, so tenant isolation is only
# real when runtime traffic uses the app roles.
#   migrated:  identity, booking, notification, conversation, knowledge,
#              crm-sync, billing-engine, kyc
#   still superuser (no per-service role exists yet — their PG_DSN is a base
#   DSN for cross-DB/infra access or TigerBeetle-backed): payments, edge,
#   voice, analytics. Extend 05-app-roles.sql before migrating these.
# ---------------------------------------------------------------------------
x-app-env:
  DAPR_HOST: ${DAPR_HOST:-}
  DAPR_HTTP_PORT: '3500'
  KAFKA_BROKERS: kafka:9092
  REDIS_ADDR: redis:6379
  # Superuser base DSN — BOOTSTRAP/MIGRATION TEMPLATE ONLY (see policy above);
  # services with app_* roles override this in their own environment block.
  PG_DSN: postgres://opendesk:opendesk@postgres:5432
  KEYCLOAK_URL: http://keycloak:8080
  # SPEC-W44 F16-2/F16-3: env names match what the code actually reads —
  # PERMIFY_URL (booking/identity config.go) and TEMPORAL_HOST_PORT
  # (booking/notification config.go). The old PERMIFY_HTTP/TEMPORAL_ADDRESS
  # names were DEAD (no code path read them); removed, no dual-write.
  PERMIFY_URL: http://permify:3476
  TEMPORAL_HOST_PORT: temporal:7233
  TEMPORAL_NAMESPACE: opendesk
  TEMPORAL_TASK_QUEUE: opendesk-main
  OPENSEARCH_ADDR: http://opensearch:9200
x-daprd:
  image: daprio/daprd:1.14.4
  command: &id001
  - ./daprd
  - --app-id
  - ${DAPR_APP_ID}
  - --app-port
  - ${DAPR_APP_PORT}
  - --components-path
  - /components
  - --config
  - /components/config.yaml
  - --log-level
  - info
  volumes: &id002
  - ./infra/dapr/components:/components
  networks: &id003
  - opendesk
services:
  identity:
    build: ./services/identity-service
    # Optional: secrets/dev overrides (compose still boots without it —
    # every ${VAR} below carries a dev fallback). cp .env.example .env
    env_file:
    - path: .env
      required: false
    environment:
      DAPR_HOST: daprd-identity
      DAPR_HTTP_PORT: '3500'
      KAFKA_BROKERS: kafka:9092
      REDIS_ADDR: redis:6379
      PG_DSN: postgres://${IDENTITY_PG_USER:-app_identity_login}:${IDENTITY_PG_PASS:-app_identity_dev_password}@postgres:5432
      KEYCLOAK_URL: http://keycloak:8080
      PERMIFY_URL: http://permify:3476
      TEMPORAL_HOST_PORT: temporal:7233
      TEMPORAL_NAMESPACE: opendesk
      TEMPORAL_TASK_QUEUE: opendesk-main
      OPENSEARCH_ADDR: http://opensearch:9200
      PORT: '7001'
      PG_DATABASE: identity
      KEYCLOAK_ADMIN_CLIENT_ID: service-accounts
      # GF5: matches the dev placeholder in infra/keycloak/realm-opendesk.json;
      # override via .env in any real environment (see infra/keycloak/README.md).
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-CHANGE_ME_DEV_ONLY}
      # SPEC-W43 G-01: least-privilege per-service role by default (see
      # 05-app-roles.sql). The opendesk superuser is for migration/bootstrap
      # jobs only — override via IDENTITY_PG_USER/IDENTITY_PG_PASS in .env.
      DATABASE_URL: postgres://${IDENTITY_PG_USER:-app_identity_login}:${IDENTITY_PG_PASS:-app_identity_dev_password}@postgres:5432/identity
      INDUSTRIES_DIR: /industries
      # SPEC-W44 K2 internal-auth contract: every /internal/* surface requires
      # X-Internal-Token matching this value (constant-time compare; 503
      # fail-closed when unset, 401 on mismatch). DEV ONLY default below
      # (repo convention: compose boots without .env); prod MUST set
      # IDENTITY_INTERNAL_TOKEN via the secrets store (docs/runbooks/secrets.md).
      IDENTITY_INTERNAL_TOKEN: ${IDENTITY_INTERNAL_TOKEN:-opendesk-dev-identity-internal-token-change-in-prod}
      # W44 caller side: outbound /dev/trigger-* calls to notification-worker
      # carry X-Internal-Token == this value (must match the notification
      # block's NOTIFICATION_INTERNAL_TOKEN). DEV ONLY default.
      NOTIFICATION_INTERNAL_TOKEN: ${NOTIFICATION_INTERNAL_TOKEN:-opendesk-dev-notification-internal-token-change-in-prod}
    volumes:
    - ./industries:/industries:ro
    # GF4 (SPEC-W34): no host port published — backends are reachable only on the
    # opendesk docker network (inter-service by name) and through APISIX :9080.
    # Publishing bypassed gateway authN entirely (any host process could call the
    # service directly and self-assign identity headers).
    networks:
    - opendesk
    depends_on:
    - postgres
    - keycloak
    - permify
    - kafka
  daprd-identity:
    image: daprio/daprd:1.14.4
    command: *id001
    volumes: *id002
    networks: *id003
    environment:
      DAPR_APP_ID: identity
      DAPR_APP_PORT: '7001'
  booking:
    build: ./services/booking-service
    # Optional: secrets/dev overrides (compose still boots without it —
    # every ${VAR} below carries a dev fallback). cp .env.example .env
    env_file:
    - path: .env
      required: false
    environment:
      DAPR_HOST: daprd-booking
      DAPR_HTTP_PORT: '3500'
      KAFKA_BROKERS: kafka:9092
      REDIS_ADDR: redis:6379
      PG_DSN: postgres://${BOOKING_PG_USER:-app_booking_login}:${BOOKING_PG_PASS:-app_booking_dev_password}@postgres:5432
      KEYCLOAK_URL: http://keycloak:8080
      PERMIFY_URL: http://permify:3476
      TEMPORAL_HOST_PORT: temporal:7233
      TEMPORAL_NAMESPACE: opendesk
      TEMPORAL_TASK_QUEUE: opendesk-main
      OPENSEARCH_ADDR: http://opensearch:9200
      PORT: '7002'
      PG_DATABASE: booking
      # Per-service DB role (SPEC-W3 §2 / SPEC-W43 G-01): defaults to the
      # least-privilege app_booking_login role (see 05-app-roles.sql). The
      # opendesk superuser is for migration/bootstrap jobs only; override via
      # BOOKING_PG_USER/BOOKING_PG_PASS in .env if a bootstrap job needs it.
      PG_USER: ${BOOKING_PG_USER:-app_booking_login}
      PG_PASS: ${BOOKING_PG_PASS:-app_booking_dev_password}
      DATABASE_URL: postgres://${BOOKING_PG_USER:-app_booking_login}:${BOOKING_PG_PASS:-app_booking_dev_password}@postgres:5432/booking
      # Wave 5 #7 customer portal: HMAC secret for 15-min portal JWTs.
      # Dev default is repo-known; prod MUST override via .env. Bootable
      # only because OPENDESK_DEV_INSECURE is explicitly set below (W44 D4).
      PORTAL_SECRET: ${PORTAL_SECRET:-opendesk-dev-portal-secret-change-in-prod}
      # SPEC-W44 K2 internal-auth contract: /internal/* and /activities/*
      # surfaces (incl. the civic sla-breach hook, S1-F7-05) require
      # X-Internal-Token matching this value (constant-time compare; 503
      # fail-closed when unset, 401 on mismatch). DEV ONLY default below;
      # prod MUST set BOOKING_INTERNAL_TOKEN via the secrets store
      # (docs/runbooks/secrets.md).
      BOOKING_INTERNAL_TOKEN: ${BOOKING_INTERNAL_TOKEN:-opendesk-dev-booking-internal-token-change-in-prod}
      # SPEC-W44 K2 caller side: identity tenant-resolution calls
      # (bookingops appgate/resolver) carry X-Internal-Token matching the
      # identity block's IDENTITY_INTERNAL_TOKEN. Same DEV ONLY default;
      # prod MUST set via the secrets store (docs/runbooks/secrets.md).
      IDENTITY_INTERNAL_TOKEN: ${IDENTITY_INTERNAL_TOKEN:-opendesk-dev-identity-internal-token-change-in-prod}
      # SPEC-W44 W-B-1 (S1-F6-02): PORTAL_SECRET is fail-closed — the
      # service refuses to boot on the dev default above unless this
      # explicit escape is set. NEVER set outside local dev.
      OPENDESK_DEV_INSECURE: ${OPENDESK_DEV_INSECURE:-'1'}  # DEV ONLY escape for the PORTAL_SECRET boot gate; NEVER set outside local dev
      # SPEC-W44 W-B-3 (S1-F7-07): X-User-Roles entries allowed to approve a
      # lending KYC override (code default "platform-admin"; csv). Uncomment
      # to widen:
      # LENDING_KYC_OVERRIDE_ROLES: ${LENDING_KYC_OVERRIDE_ROLES:-platform-admin}
      # SPEC-W44 W-B-4 (S1-F7-08): approved referral commissions mature this
      # many seconds before the recon schedule enqueues payout. Uncomment to
      # override the code default:
      # COMMISSION_MATURITY_SECONDS: ${COMMISSION_MATURITY_SECONDS:-2592000}
      NOTIFICATIONS_TOPIC: opendesk.notifications.outbox
      # SPEC-W32 civic reporting: CloudEvents topic + public intake throttle.
      CIVIC_EVENTS_TOPIC: opendesk.civic.events.v1
      CIVIC_PUBLIC_RATE_PER_HOUR: ${CIVIC_PUBLIC_RATE_PER_HOUR:-10}
      CIVIC_PUBLIC_RATE_PER_DAY: ${CIVIC_PUBLIC_RATE_PER_DAY:-50}
      # SPEC-W8 A1 geospatial: optional Nominatim geocoding hook (off by
      # default) + geo campaign send batch size.
      GEOCODE_ENABLED: ${GEOCODE_ENABLED:-false}
      GEOCODE_BASE_URL: ${GEOCODE_BASE_URL:-https://nominatim.openstreetmap.org}
      GEO_CAMPAIGN_BATCH: ${GEO_CAMPAIGN_BATCH:-50}
      # W39 mock-rail contract — the dev stack has no payout-provider
      # credentials, no live TigerBeetle bridge for lending, and no social
      # API credentials, so these are opted in EXPLICITLY here. Code defaults
      # are ALL OFF (fail-closed); production must leave them unset/0.
      ALLOW_MOCK_RAILS: ${ALLOW_MOCK_RAILS:-1}  # DEV ONLY — mock rail (lending disbursement intents)
      PAYOUT_MOCK: ${PAYOUT_MOCK:-1}            # DEV ONLY — mock rail (referral/commission payouts)
      SOCIAL_MOCK: ${SOCIAL_MOCK:-1}            # DEV ONLY — mock rail (social-publisher providers)
    # GF4 (SPEC-W34): no host port published — backends are reachable only on the
    # opendesk docker network (inter-service by name) and through APISIX :9080.
    # Publishing bypassed gateway authN entirely (any host process could call the
    # service directly and self-assign identity headers).
    networks:
    - opendesk
    depends_on:
    - postgres
    - kafka
    - temporal
    - permify
  daprd-booking:
    image: daprio/daprd:1.14.4
    command: *id001
    volumes: *id002
    networks: *id003
    environment:
      DAPR_APP_ID: booking
      DAPR_APP_PORT: '7002'
  notification:
    build: ./services/notification-worker
    # Optional: secrets/dev overrides (compose still boots without it —
    # every ${VAR} below carries a dev fallback). cp .env.example .env
    env_file:
    - path: .env
      required: false
    environment:
      DAPR_HOST: daprd-notification
      DAPR_HTTP_PORT: '3500'
      KAFKA_BROKERS: kafka:9092
      REDIS_ADDR: redis:6379
      # SPEC-W43 G-01: least-privilege app_notifications_login by default
      # (05-app-roles.sql); superuser only for migration/bootstrap jobs.
      # SPEC-W44: code reads DATABASE_URL (internal/config/config.go), not
      # PG_DSN — and the DSN MUST carry the /notifications dbname (pgx
      # otherwise defaults the database to the user name).
      DATABASE_URL: postgres://${NOTIFICATIONS_PG_USER:-app_notifications_login}:${NOTIFICATIONS_PG_PASS:-app_notifications_dev_password}@postgres:5432/notifications
      KEYCLOAK_URL: http://keycloak:8080
      PERMIFY_HTTP: http://permify:3476
      # SPEC-W44 F16-3: code reads TEMPORAL_HOST_PORT (notification
      # config.go); the old TEMPORAL_ADDRESS name was never read.
      TEMPORAL_HOST_PORT: temporal:7233
      TEMPORAL_NAMESPACE: opendesk
      TEMPORAL_TASK_QUEUE: opendesk-main
      OPENSEARCH_ADDR: http://opensearch:9200
      PORT: '7003'
      INDUSTRIES_DIR: /industries
      # GDPR workflows (SPEC-W3 §2): export collection + MinIO bundle upload.
      CONVERSATION_APP_ID: conversation
      PRIVACY_EVENTS_TOPIC: opendesk.privacy.events
      # SPEC-W32 WS-B civic SLA/status: case events consumer + escalation
      # topic + citizen status channel (transactional, DND-bypass).
      CIVIC_EVENTS_TOPIC: opendesk.civic.events.v1
      CIVIC_EVENTS_GROUP: notification-civic
      CIVIC_ESCALATION_TOPIC: opendesk.civic.events.v1
      CIVIC_STATUS_CHANNEL: ${CIVIC_STATUS_CHANNEL:-sms}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_EXPORTS_BUCKET: exports
      # Outbound CPS pacing + sender rotation (VOICE-SCALING §4 telephony).
      OUTBOUND_CPS: ${OUTBOUND_CPS:-1.0}
      OUTBOUND_BURST: ${OUTBOUND_BURST:-3}
      PACER_BACKEND: ${PACER_BACKEND:-redis}
      OUTBOUND_FROM_NUMBERS: ${OUTBOUND_FROM_NUMBERS:-}
      # Messaging channel routing (docs/integrations/messaging-channels.md):
      # per-tenant provider selection for sms/email sends.
      MESSAGING_CHANNELS: ${MESSAGING_CHANNELS:-email:smtp,sms:twilio}
      TENANT_CHANNEL_MAP: ${TENANT_CHANNEL_MAP:-}
      # SPEC-W12 §3/§8: DND 2442 suppression + quiet-hours deferral guards.
      DND_ENFORCEMENT: ${DND_ENFORCEMENT:-true}
      QUIET_HOURS_DEFAULT: ${QUIET_HOURS_DEFAULT:-20:00-08:00}
      QUIET_HOURS_OVERRIDES: ${QUIET_HOURS_OVERRIDES:-}
      # SPEC-W44 K2 internal-auth contract: Temporal-signal + /internal/*
      # surfaces require X-Internal-Token matching this value (constant-time
      # compare; 503 fail-closed when unset, 401 on mismatch). DEV ONLY
      # default below; prod MUST set NOTIFICATION_INTERNAL_TOKEN via the
      # secrets store (docs/runbooks/secrets.md).
      NOTIFICATION_INTERNAL_TOKEN: ${NOTIFICATION_INTERNAL_TOKEN:-opendesk-dev-notification-internal-token-change-in-prod}
      # SPEC-W44 K2 caller side (W-N-4/W-N-5): outbound calls to gated
      # /internal/* + dev/* surfaces (identity tenant delete, payments
      # hold-deposit/void, booking activities) carry X-Internal-Token
      # matching each target's server block. Same DEV ONLY defaults; prod
      # MUST set via the secrets store (docs/runbooks/secrets.md).
      PAYMENTS_INTERNAL_TOKEN: ${PAYMENTS_INTERNAL_TOKEN:-opendesk-dev-payments-internal-token-change-in-prod}
      IDENTITY_INTERNAL_TOKEN: ${IDENTITY_INTERNAL_TOKEN:-opendesk-dev-identity-internal-token-change-in-prod}
      BOOKING_INTERNAL_TOKEN: ${BOOKING_INTERNAL_TOKEN:-opendesk-dev-booking-internal-token-change-in-prod}
      # W-N-5 (K5): direct HTTP base URL for payments internal calls when
      # Dapr header passthrough is unavailable (hold-deposit/void).
      PAYMENTS_URL: ${PAYMENTS_URL:-http://payments:7004}  # W44 V1 fix: payments listens on 7004 (7010 is crm-sync)
      # Optional RLS escape DSN (app_notifications_internal member, the
      # identity INTERNAL_DATABASE_URL idiom): intentionally UNSET in dev —
      # 05-app-roles.sql grants no LOGIN member of the escape role, so set
      # this only with a provisioned member login.
      # INTERNAL_DATABASE_URL: postgres://...@postgres:5432/notifications
      # SPEC-W44 W-N-2: X-User-Roles entries allowed to import/delete DND
      # registry entries (admin claim), csv.
      DND_ADMIN_ROLES: ${DND_ADMIN_ROLES:-platform-admin}
      # SPEC-W44 W-N-1: /dev/* trigger endpoints (onboarding, twin cleanup)
      # are a dev convenience — explicit opt-in, and additionally gated by
      # NOTIFICATION_INTERNAL_TOKEN above. W44 F3: even when enabled, /dev/*
      # requires X-Internal-Token == NOTIFICATION_INTERNAL_TOKEN. Default OFF;
      # opt in for local dev only.
      OPENDESK_DEV_ENDPOINTS: ${OPENDESK_DEV_ENDPOINTS:-0}  # DEV opt-in — /dev/* triggers (token-gated)
      # K1 dev escape (explicit, logged): trust a caller-supplied tenant
      # without the gateway-injected X-Tenant-Slugs header. OFF by default.
      # OPENDESK_TRUST_DIRECT_TENANT: '1'  # DEV ONLY — never set in prod
      # SPEC-W44 K3/W-N-6: ops-alerts consumer (opendesk.ops.alerts ->
      # ops_alerts table + GET /v1/ops-alerts, DND-admin gated).
      OPS_ALERTS_TOPIC: ${OPS_ALERTS_TOPIC:-opendesk.ops.alerts}
      OPS_ALERTS_GROUP: ${OPS_ALERTS_GROUP:-notification-ops-alerts}
      # W39 mock-rail contract — dev has no FCM credentials and no Meta
      # WhatsApp app secret, so the mocks are opted in EXPLICITLY here. Code
      # defaults are OFF (fail-closed); production must leave unset/0.
      FCM_MOCK: ${FCM_MOCK:-1}            # DEV ONLY — mock rail (push sends logged, no network)
      WHATSAPP_MOCK: ${WHATSAPP_MOCK:-1}  # DEV ONLY — mock rail (WhatsApp sends simulated)
    volumes:
    - ./industries:/industries:ro
    # GF4 (SPEC-W34): no host port published — backends are reachable only on the
    # opendesk docker network (inter-service by name) and through APISIX :9080.
    # Publishing bypassed gateway authN entirely (any host process could call the
    # service directly and self-assign identity headers).
    networks:
    - opendesk
    depends_on:
    - temporal
    - kafka
    - redis
  messaging-gateway:
    build: ./services/messaging-gateway
    # Nigeria messaging channel (Termii / Africa's Talking / WhatsApp Cloud
    # API). Reached through the Dapr HTTP bindings bindings-termii /
    # bindings-africastalking / bindings-whatsapp, which are scoped to the
    # notification sidecar — no daprd sidecar needed here.
    env_file:
    - path: .env
      required: false
    environment:
      PORT: '7011'
      TERMII_API_KEY: ${TERMII_API_KEY:-}
      TERMII_SENDER_ID: ${TERMII_SENDER_ID:-OpenDesk}
      AT_API_KEY: ${AT_API_KEY:-}
      AT_USERNAME: ${AT_USERNAME:-}
      AT_FROM: ${AT_FROM:-}
      # SPEC-W12 §8: NG SMS aggregator chain (eBulksms + failover order).
      EBULK_API_KEY: ${EBULK_API_KEY:-}
      EBULK_USERNAME: ${EBULK_USERNAME:-}
      SMS_PROVIDER_CHAIN: ${SMS_PROVIDER_CHAIN:-africastalking,termii,ebulksms}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      # Omnichannel inbound (SPEC-W6 Part A): provider webhooks terminate on
      # /webhooks/* (public via the APISIX webhooks-messaging route).
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      # Channel identity → tenant/site routing, JSON:
      # {"whatsapp:<phone_number_id>":{"site_slug":"...","tenant_id":"<uuid>"},
      #  "telegram:<bot_username>":{"site_slug":"...","tenant_id":"<uuid>"}}
      CHANNEL_SITE_MAP: ${CHANNEL_SITE_MAP:-}
      # Inbound bridge upstreams. Empty = via the Dapr sidecar invoke API on
      # DAPR_HTTP_PORT (requires a daprd sidecar for app-id
      # messaging-gateway). For sidecar-less dev, uncomment the direct bases:
      # CONVERSATION_URL: http://conversation:7007
      # VOICE_RUNTIME_URL: http://voice:7006
      CONVERSATION_URL: ${CONVERSATION_URL:-}
      VOICE_RUNTIME_URL: ${VOICE_RUNTIME_URL:-}
      # IoT incident ingest (SPEC-W11 Part B §6): per-tenant shared secrets
      # for POST /webhooks/incidents, JSON {"<tenant_slug|tenant_id>":"<secret>"}.
      # BOOKING_URL empty = forward via Dapr invoke app-id booking.
      INCIDENT_WEBHOOK_SECRETS: ${INCIDENT_WEBHOOK_SECRETS:-}
      BOOKING_URL: ${BOOKING_URL:-}
      # W39 mock-rail contract — dev has no Meta app secret, so unsigned
      # inbound WhatsApp posts are opted in EXPLICITLY here (messaging-gateway
      # logs CRITICAL at startup). Code default OFF (fail-closed, unsigned =
      # 403); production must leave unset/0 and set WHATSAPP_APP_SECRET.
      WHATSAPP_MOCK: ${WHATSAPP_MOCK:-1}  # DEV ONLY — mock rail (unsigned WhatsApp webhook intake)
    # GF4 (SPEC-W34): no host port published — backends are reachable only on the
    # opendesk docker network (inter-service by name) and through APISIX :9080.
    # Publishing bypassed gateway authN entirely (any host process could call the
    # service directly and self-assign identity headers).
    networks:
    - opendesk
  daprd-notification:
    image: daprio/daprd:1.14.4
    command: *id001
    volumes: *id002
    networks: *id003
    environment:
      DAPR_APP_ID: notification
      DAPR_APP_PORT: '7003'
  payments:
    build: ./services/payments-service
    # Optional: secrets/dev overrides (compose still boots without it —
    # every ${VAR} below carries a dev fallback). cp .env.example .env
    env_file:
    - path: .env
      required: false
    environment:
      DAPR_HOST: daprd-payments
      DAPR_HTTP_PORT: '3500'
      KAFKA_BROKERS: kafka:9092
      REDIS_ADDR: redis:6379
      PG_DSN: postgres://opendesk:opendesk@postgres:5432
      KEYCLOAK_URL: http://keycloak:8080
      PERMIFY_URL: http://permify:3476
      TEMPORAL_HOST_PORT: temporal:7233
      TEMPORAL_NAMESPACE: opendesk
      TEMPORAL_TASK_QUEUE: opendesk-main
      OPENSEARCH_ADDR: http://opensearch:9200
      PORT: '7004'
      # DEV ONLY — mock rail: in-memory sim ledger (ADR-0007) so the dev
      # stack boots without a TigerBeetle client; prod sets LEDGER_IMPL=tigerbeetle
      # explicitly. Sim postings move NO real money.
      LEDGER_IMPL: ${LEDGER_IMPL:-sim}
      # W39 RS-007 env-name fix: payments-service reads TB_ADDRESSES
      # (src/config.rs, default tigerbeetle:3000) — the previous
      # TIGERBEETLE_ADDR key here was DEAD (never read by any code path).
      TB_ADDRESSES: ${TB_ADDRESSES:-tigerbeetle:3000}
      MOJALOOP_ENDPOINT: http://mojaloop:8444
      # DEV ONLY — mock rail: MOJALOOP_ENDPOINT above points at the
      # mojaloop/simulator container (infra/docker-compose.core.yml), so the
      # dev stack EXPLICITLY opts into the simulated Mojaloop rail. Prod MUST
      # unset this (code default OFF; fail-closed) and use a real FSPIOP
      # endpoint.
      MOJALOOP_ALLOW_SIM: ${MOJALOOP_ALLOW_SIM:-1}
      # SPEC-W44 K2 internal-auth contract (S1-R2/F16-6): every /internal/*
      # and /activities/* surface (deposit sagas, no-show-fees, ...) requires
      # X-Internal-Token matching this value (constant-time compare; 503
      # fail-closed when unset, 401 on mismatch). Without this default the
      # gate was OFF and post-P-09 saga/activity flows were permanently dead.
      # DEV ONLY default below; prod MUST set PAYMENTS_INTERNAL_TOKEN via the
      # secrets store (docs/runbooks/secrets.md). Callers (notification-worker
      # hold-deposit/void activities) get the same value via their own env.
