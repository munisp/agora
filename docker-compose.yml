      PORT: '7012'
      # Per-service DB role (SPEC-W3 §2 / SPEC-W43 G-01): defaults to the
      # least-privilege app_billing_login role (see 05-app-roles.sql).
      # MIGRATION/BOOTSTRAP NOTE: billing-engine applies migrations 0001-0004
      # on the DATABASE_URL connection at boot, which needs DDL privileges —
      # for least-privilege runtime, run the migrations as the opendesk
      # superuser first (e.g. psql -f services/billing-engine/migrations/
      # against the billing DB) and keep BILLING_PG_USER=app_billing_login,
      # or point DATABASE_URL at the superuser for the bootstrap deploy only.
      DATABASE_URL: postgres://${BILLING_PG_USER:-app_billing_login}:${BILLING_PG_PASS:-app_billing_dev_password}@postgres:5432/billing
      KAFKA_GROUP_ID: billing-engine
      USAGE_EVENTS_TOPIC: opendesk.usage.events
      BILLING_EVENTS_TOPIC: opendesk.billing.events
      # Wave 7 (SPEC-W7 Part B): Paystack live mode when the secret key is
      # set; otherwise static EMVCo-style QR payloads from the account below.
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_DEFAULT_EMAIL: ${PAYSTACK_DEFAULT_EMAIL:-billing@opendesk.local}
      PAYSTACK_CALLBACK_URL: ${PAYSTACK_CALLBACK_URL:-http://localhost:9080/billing/callback}
      # DEV ONLY stand-ins (W39 SIM-030): the code no longer has hardcoded
      # static-mode merchant coordinates — these dev values are what keeps
      # the static EMV QR fallback usable in dev. Prod MUST set the real
      # merchant account/name via .env / the secrets store; shipping these
      # would silently misdirect payments.
      BILLING_STATIC_ACCOUNT: ${BILLING_STATIC_ACCOUNT:-OPENDESK/0123456789}
      BILLING_MERCHANT_NAME: ${BILLING_MERCHANT_NAME:-OPENDESK DEMO}
      DUNNING_INTERVAL_S: ${DUNNING_INTERVAL_S:-3600}
      INVOICE_DUE_DAYS: ${INVOICE_DUE_DAYS:-14}
      # W39 RS-007: billing ledger implementation. billing-engine accepts ONLY
      # `postgres` (default; DATABASE_URL + migrations 0001-0004 above) or
      # `sim` — any other value aborts boot (src/config.rs SIM-029). The REAL
      # impl is the default here on purpose; `sim` must NEVER be selected
      # silently — opt in only for isolated dev/tests via BILLING_LEDGER_IMPL=sim.
      BILLING_LEDGER_IMPL: ${BILLING_LEDGER_IMPL:-postgres}
      # W39 RS-007 internal-auth contract: billing rejects any request whose
      # x-internal-token header does not match this value. APISIX strips
      # client-supplied x-internal-token globally; W44 F1 REMOVED the former
      # injection on /api/billing/* — human calls now authenticate via K1
      # (X-Tenant-Slugs binding + X-User-Roles); this token is for in-cluster
      # service callers only.
      # DEV ONLY default below (repo convention: compose boots without .env);
      # prod MUST set BILLING_INTERNAL_TOKEN via the secrets store
      # (docs/runbooks/secrets.md).
      BILLING_INTERNAL_TOKEN: ${BILLING_INTERNAL_TOKEN:-opendesk-dev-billing-internal-token-change-in-prod}
      # W44 F1: human uuid-tenant binding resolves slugs via identity
      # GET /v1/tenants/{slug} (service-caller auth). Must match the identity
      # block's IDENTITY_INTERNAL_TOKEN. DEV ONLY default; prod via secrets.
      IDENTITY_INTERNAL_TOKEN: ${IDENTITY_INTERNAL_TOKEN:-opendesk-dev-identity-internal-token-change-in-prod}
    # GF4 (SPEC-W34): no host port published — backends are reachable only on the
    # opendesk docker network (inter-service by name) and through APISIX :9080.
    # Publishing bypassed gateway authN entirely (any host process could call the
