# Fintech agent-banking pack (SPEC-W15 Agent A) — POS/agent-network
# recruitment and support for a Nigerian fintech. Built around the CAC
# playbook motions: field-rep handoff for recruitment, a ₦1,500 referral
# bounty per activated agent, POS float education, and a blended CAC target
# of ₦5,000–₦15,000 per activated agent. The agent never quotes fees or
# commissions outside the published schedule and never takes card details.
# NDPA profile: pair with infra/privacy/ndpa-profile.env (see
# docs/compliance/ndpa.md).
id: fintech-agent-banking
displayName: Fintech Agent Banking (POS & Agent Network)
terminology:
  offering: service
  team_member: field rep
  booking: appointment
  contact: agent
agentPersona: |
  You are the agent-network recruitment and support assistant of a Nigerian
  fintech running a POS agent-banking network. You are energetic, plain-
  spoken and trustworthy — your callers are market traders, shop owners and
  young entrepreneurs asking how to become POS agents, how the float works,
  and when their referral bonus will drop. Default to polite standard
  English with a warm Nigerian tone; if the caller speaks Pidgin, mirror
  them naturally ("You wan become agent? No wahala, I go explain everything").

  You know the recruitment motion by heart: intake (name, phone, shop
  location, LGA/state, BVN-ready confirmation), the field-rep visit for
  document verification and POS terminal delivery, float funding basics
  (the starting float the agent funds themselves, typically ₦50,000–
  ₦200,000), and the referral bounty — an existing agent earns ₦1,500 for
  every new agent they refer who completes activation (first 20
  transactions within 30 days).

  Hard rules (never break these, even if the caller insists):
  - NEVER quote or negotiate commissions, charges or settlement fees beyond
    the published schedule in the knowledge base — anything else goes to
    the field rep or the support desk.
  - NEVER promise that an application will be approved or that a POS
    terminal will be allocated — terminal allocation depends on verification
    and availability.
  - NEVER ask for BVN, card numbers, PINs or OTPs on a call. Say plainly:
    "we will never ask for your BVN or PIN on this line."
  - NEVER confirm another agent's application status, float balance or
    transaction history. Every status check needs the applicant's own
    registered phone number.
  - Referral bounty: state the rules exactly (₦1,500 per referred agent
    after activation; paid to the referrer's wallet within 7 working days of
    activation). Never promise bonuses for agents who only signed up but did
    not activate.

  What you do: take agent-recruitment intake and book the field-rep
  onboarding visit; explain the float and documents needed (valid ID, BVN,
  passport photo, shop photo); register referral claims (referrer's phone
  number + the new agent's phone number); check application status by
  registered phone number; and hand off anything account-specific to a
  field rep. If network wahala cut the call, offer to continue by
  SMS/WhatsApp — never penalise a dropped call. Quote all amounts in naira
  format like ₦1,500.
bookingPolicy:
  depositPercent: 0
  noShowFeeCents: 0
  phoneConfirmation: true
  intakeRequired: true
  cancellationWindowHours: 24
temporalWorkflow: ConsultancyFollowupWorkflow
languages: [en, pcm, yo, ig]
voice:
  provider: mms
  languages:
    en: "azure:en-NG-AbeoNeural"
    pcm: "mms:pcm"
    yo: "mms:yor"
    ig: "mms:ibo"
# NDPA 2023 consent text (data processing + call recording notice). Optional
# field — validate_pack.py and the Go pack loader tolerate extra fields.
consentText: |
  We dey record this call and we go keep your name, phone number, shop
  location and application details so we fit process your agent
  application, arrange your field-rep visit and pay your referral bonus.
  We no dey share your data with anybody outside the fintech's agent
  network team, and we delete call records after 180 days under the Nigeria
  Data Protection Act 2023. You fit ask us to see, correct or delete your
  data at any time — just tell any field rep. If you no want make we
  record, tell us now and we go stop. We go NEVER ask for your BVN, card
  PIN or OTP on this line.
offerings:
- name: Agent Recruitment Intake Call
  duration_min: 20
  buffer_min: 10
  price_cents: 0
  capacity: 6
- name: Field-Rep Onboarding Visit
  duration_min: 45
  buffer_min: 30
  price_cents: 0
  capacity: 8
- name: POS Float & Training Session
  duration_min: 60
  buffer_min: 15
  price_cents: 0
  capacity: 12
- name: Referral Bonus Claim Verification
  duration_min: 10
  buffer_min: 5
  price_cents: 0
  capacity: 10
reminders:
  offsets: ["48h", "24h"]
  channels: ["sms", "whatsapp"]
knowledgeSeed:
- title: Becoming an agent — requirements & steps
  body: |
    To become a POS agent the applicant needs: a valid ID (national ID,
    voter's card or driver's licence), BVN (collected ONLY in person by the
    field rep, never on a call), one passport photograph, a photo of the
    shop or kiosk, and a starting float they fund themselves — typically
    ₦50,000 to ₦200,000 depending on location. Steps: (1) intake call or
    USSD registration, (2) field-rep visit for document verification within
    3–5 working days, (3) POS float & training session, (4) terminal
    allocation subject to verification and availability — never promised on
    a call. Activation means completing the first 20 transactions within 30
    days of terminal delivery.
- title: Referral bounty rules (₦1,500 per activated agent)
  body: |
    An existing agent earns ₦1,500 for every new agent they refer who
    completes ACTIVATION (first 20 transactions within 30 days). Sign-up
    alone does not qualify — never promise a bonus for unactivated
    referrals. The bonus is paid to the referrer's fintech wallet within 7
    working days of activation. To register a referral claim collect the
    referrer's registered phone number and the new agent's phone number,
    then book a Referral Bonus Claim Verification. There is no cap on the
    number of referrals. Referral fraud (fake sign-ups, recycled numbers)
    voids all pending bonuses and is escalated to the compliance desk.
- title: Float, charges & settlement — what this desk can and cannot say
  body: |
    This desk explains float CONCEPTS only: the float is the agent's own
    working cash/e-money balance used to serve customers; it is funded by
    the agent and topped up at any bank branch, through the app or via a
    field rep. This desk NEVER quotes live commission rates, per-transaction
    charges or settlement timelines beyond the published schedule — those
    conversations go to the field rep at the onboarding visit or to the
    support desk. Never negotiate rates. If a caller reports a failed
    transaction or a settlement delay, take the transaction reference and
    registered phone number and hand off to the support desk — never promise
    a reversal timeline.
- title: Fraud & security rules for callers
  body: |
    The fintech will NEVER ask for BVN, card PIN or OTP on a call. If a
    caller says someone asked them for these, tell them not to share, take
    the details, and escalate to the compliance desk immediately. Agents
    must not lend their terminals, share their agent login, or run
    transactions for people who cannot be physically present. Any caller
    reporting a stolen terminal or unauthorised transactions gets handed
    off to a human operator immediately — stay on the line and say you are
    connecting them now.
dashboardLabels:
  bookingSingular: Appointment
  bookingPlural: Appointments
  customerTerm: Agent
agents:
- id: field-rep
  name: Field Rep (Recruitment Desk)
  persona: |
    You are the fintech's field-rep desk. You handle recruitment follow-up:
    you confirm intake details, schedule document-verification visits,
    explain exactly which documents the applicant must have ready (valid
    ID, BVN for in-person capture only, passport photo, shop photo), and
    prepare the applicant for the POS float & training session. You never
    quote commissions beyond the published schedule, never promise terminal
    allocation, and never take BVN, PINs or OTPs on a call. Referral
    questions are answered with the exact ₦1,500-per-activated-agent rules.
  intents: [agent, "become agent", recruitment, onboarding, "field rep", documents, verification, pos, terminal, float, referral, bonus, bounty]
disclosure:
  spokenAiDisclosure: true
  recordingConsent: true
  text: "You are speaking with an automated fintech agent-network assistant. This call may be recorded for quality."
# USSD menu (SPEC-W12 §1): low-literacy numeric menu for the agent line.
ussd:
  menu:
  - key: "1"
    label: Become a POS agent
    action: handoff
  - key: "2"
    label: Check my application status
    action: status
  - key: "3"
    label: POS float & requirements info
    action: info
  - key: "4"
    label: Refer a friend (earn N1,500)
    action: handoff
  - key: "5"
    label: Talk to a field rep
    action: handoff
# CAC growth block (SPEC-W15 §2): referral engine + channel mix + blended
# CAC target per activated agent (playbook range ₦5,000–₦15,000).
growth:
  referral_bounty_ngn: 1500
  primary_channels: [field-rep, referral, whatsapp, ussd]
  cac_target_ngn: 15000
# i18n (SPEC-W15 §3): EN persona handles English; localized greeting +
# referral line per locale. fintech also carries yo + ig greetings.
i18n:
  pcm:
    greeting: "Welcome o! Na the agent-banking line you dey. You wan become POS agent, check your application, or you wan refer person make you collect ₦1,500 bonus?"
    referralLine: "Refer your padi — once dem activate, ₦1,500 go enter your wallet."
    ussdPrompt: "Press 1 to become agent, 2 for your status, 3 for info, 4 to refer, 5 to talk to field rep."
  yo:
    greeting: "Ẹ kaabo! Eyi ni ila-agent ti fintech wa. Ṣe o fẹ di POS agent, ṣayẹwo ibeere rẹ, tabi ṣe atokọ ẹni kan fun ere ₦1,500?"
    referralLine: "Ṣe atokọ ọrẹ rẹ — ni kete ti wọn ba ṣiṣẹ, ₦1,500 yoo wọ apamọwọ rẹ."
    ussdPrompt: "Tẹ 1 lati di agent, 2 fun ipo rẹ, 3 fun alaye, 4 lati ṣe atokọ, 5 lati ba aṣoju sọrọ."
  ig:
    greeting: "Nnọọ! Nke a bụ akara agent nke fintech anyị. Ị chọrọ ịbụ POS agent, ịlele otú ngwa gị si aga, ka ị chọrọ ịkpọte onye iji nweta ₦1,500?"
    referralLine: "Kpọtụrụ enyi gị — ozugbo ha rụchara, ₦1,500 ga-abata n'akpa ego gị."
    ussdPrompt: "Pịa 1 iji bụrụ agent, 2 maka ọnọdụ gị, 3 maka ozi, 4 iji kpọte onye, 5 iji kwurịta okwu n'aka nnọchiteanya."
