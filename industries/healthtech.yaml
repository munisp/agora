knowledgeSeed:
- title: Clinic referral intake
  body: |
    Partner clinics refer patients for teleconsults or specialist review.
    Intake captures: the referring clinic and clinician, the reason
    category (general, specialist, mental health, maternal/child health,
    chronic care follow-up), the patient's preferred language (English,
    Pidgin, Yoruba, Igbo, Hausa), and NHIA/HMO status. Intake never records
    a diagnosis and never interprets symptoms — the reason category is for
    routing only. Referred patients are booked into the next suitable
    teleconsult slot, and the referring clinic receives the appointment
    confirmation.
- title: NHIA & HMO coverage questions
  body: |
    The platform works with NHIA-accredited HMO plans and selected private
    HMOs. Coverage depends on the patient's specific plan, so the intake
    desk never confirms that a treatment is covered: it explains the three
    steps (confirm the HMO and plan name, book a benefits-verification call
    with the HMO desk, receive written confirmation before a paid
    consultation) and books the verification call. Patients without HMO
    coverage pay the published teleconsult fee; payment is by transfer or
    the secure payment link — agents never take card details, PINs or OTPs.
- title: Teleconsult booking & preparation
  body: |
    Teleconsults run daily 8:00–20:00 WAT, by voice or video. Preparation:
    a quiet private space, a charged phone, the list of current
    medications, and any referral letter or recent test results (shared via
    the secure upload link, never read out on a call). General teleconsults
    are 20 minutes, specialist 30 minutes. Cancellations and reschedules
    are free up to 12 hours before the appointment. The doctor may refer
    the patient back to a partner clinic for physical examination or tests
    — the teleconsult does not replace emergency care.
- title: Partner clinic referral bounty
  body: |
    A registered partner clinic earns a ₦1,500 referral bounty for every
    referred patient who completes a paid teleconsult. The bounty is
    settled monthly per clinic, with a referral statement. Patients are
    never charged extra because of a referral, and the bounty never
    influences which clinician or clinic a patient is routed to — routing
    follows clinical and geographic fit only.
dashboardLabels:
  bookingSingular: Appointment
  bookingPlural: Appointments
  customerTerm: Patient
agents:
- id: referral-intake-coordinator
  name: Referral Intake Coordinator
  persona: |
    You are the referral intake coordinator. You complete clinic referral
    intake — referring clinic, reason category, preferred language,
    NHIA/HMO status — and book the teleconsult. You never interpret
    symptoms or name conditions; for any emergency sign you immediately
    tell the caller to call emergency services or go to the nearest
    emergency department. You explain the ₦1,500 partner-clinic referral
    bounty when clinics ask.
  intents: [referral, referred, clinic, "my clinic", intake, register, "sign up", patient, doctor, teleconsult, consultation, book, booking, appointment]
- id: benefits-verification-officer
  name: HMO/NHIA Benefits Officer
  persona: |
    You are the HMO/NHIA benefits officer. You explain how coverage
    verification works for NHIA-accredited and private HMO plans, collect
    the HMO and plan name, and book the benefits-verification call. You
    never confirm that a specific treatment is covered — written
    confirmation comes from the HMO desk after verification.
  intents: [nhia, hmo, insurance, coverage, covered, "health insurance", "my plan", benefits, verification, "retainer ship", retainership]
