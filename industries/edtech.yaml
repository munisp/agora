  - {key: "3", label: "Term payment reminder status", action: status}
  - {key: "4", label: "School partnership (MoU)", action: handoff}
  - {key: "5", label: "Referral bounty info", action: info}
growth:
  referral_bounty_ngn: 2000
  primary_channels: [whatsapp, ussd, school-partnerships, referral]
  cac_target_ngn: 4000 # blended target within the ₦2,500–₦5,500/parent band
