openapi: 3.0.3
info:
  title: OpenDesk payments-service API
  version: "1.0.0"
  description: |
    REST API of `payments-service` (Rust, axum) — deposit holds, captures,
    refunds, no-show fees, balances and Mojaloop payouts over a double-entry
    ledger, plus Temporal saga activity callbacks (SPEC §6, §9).

    Generated from `services/payments-service/src/routes.rs` (+ `ledger/`,
    `mojaloop.rs` for types).

    ## Ledger
    * Implementation selected by env `LEDGER_IMPL=sim|tigerbeetle` (default
      `sim` in dev — see ADR-0007). The REST contract is identical.
    * Transfer codes (SPEC §9): `100` deposit hold (pending), `101` capture,
      `102` refund, `103` no-show fee, `104` payout.
    * Holds are two-phase: a hold creates a `pending` transfer; capture posts
      it (split into revenue + platform fee), refund/void releases it.
    * All mutations are idempotent: transfer ids are derived from the
      caller's `idempotency_key` (or deterministic fallbacks such as
      `hold:{booking_id}`, `capture:{deposit_id}`), so retries return the
      original transfer instead of double-posting.
    * Events (`DepositHeld`, `DepositCaptured`, `RefundPosted`,
      `NoShowFeePosted`, `PayoutPosted`, `HoldVoided`) are published as
      CloudEvents on Kafka `opendesk.payments.events` via Dapr pubsub.

    ## Errors
    `{"error": "<message>"}` with status mapping: 400 invalid input,
    404 account/transfer not found, 409 duplicate id / already resolved /
    not pending, 422 amount exceeds pending or overdraft, 502 ledger or
    Mojaloop backend error.

servers:
  - url: http://localhost:7004
    description: service-internal (not host-published since W34 GF4; reachable only inside the compose network)
  - url: http://localhost:9080/api/payments
    description: via APISIX gateway

tags:
  - name: meta
  - name: deposits
  - name: refunds
  - name: accounts
  - name: payouts
  - name: activities
  - name: flutterwave
  - name: webhooks
  - name: internal

paths:
  /healthz:
    get:
      tags: [meta]
      summary: Liveness probe
      operationId: healthz
      responses:
        "200":
          description: Service up; reports the active ledger implementation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: payments-service }
                  ledger_impl:
                    type: string
                    enum: [sim, tigerbeetle]

  /v1/deposits:
    post:
      tags: [deposits]
      summary: Hold a deposit (transfer code 100, pending)
      description: |
        Creates a pending hold from the tenant `deposits` account.
        Idempotency: explicit `idempotency_key`, else `hold:{booking_id}`
        when `booking_id` is present.
      operationId: holdDeposit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HoldDepositBody" }
      responses:
        "201":
          description: Held deposit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepositResponse" }
        "400":
          description: amount_cents must be > 0
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Idempotency conflict / already resolved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Overdraft or invalid amount
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/deposits/{id}/capture:
    post:
      tags: [deposits]
      summary: Capture a held deposit (code 101)
      description: |
        Posts the pending hold (fully, or partially when `amount_cents` is
        given) and splits the captured amount into tenant revenue and the
        platform fee account. Capture transfer id is deterministic
        (`capture:{deposit_id}`), so retries are idempotent.
      operationId: captureDeposit
      parameters:
        - name: id
          in: path
          required: true
          description: Deposit (pending transfer) id
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaptureBody" }
      responses:
        "200":
          description: Capture result (posting transfer + revenue/fee split)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaptureResponse" }
        "404":
          description: Deposit not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Hold already resolved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Amount exceeds pending hold
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/refunds:
    post:
      tags: [refunds]
      summary: Refund a deposit (code 102)
      description: |
        Refunds a held/captured deposit. `amount_cents` of `0` (the default)
        refunds/voids the full remaining amount. Idempotency: explicit
        `idempotency_key`, else `refund:{deposit_id}:{amount_cents}`.
      operationId: refund
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefundBody" }
      responses:
        "201":
          description: Refund transfer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transfer" }
        "404":
          description: Deposit not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Amount exceeds available funds
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/no-show-fee:
    post:
      tags: [deposits]
      summary: Charge a no-show fee against a deposit (code 103)
      description: Captures `amount_cents` from the pending deposit hold as a
        fee. Transfer id is deterministic (`no-show-fee:{deposit_id}`).
      operationId: noShowFee
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoShowFeeBody" }
      responses:
        "201":
          description: Fee capture result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaptureResult" }
        "400":
          description: amount_cents must be > 0
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Fee exceeds pending hold
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/accounts/{tenant_id}/balance:
    get:
      tags: [accounts]
      summary: Tenant ledger balances
      description: Posted and pending debits/credits for all tenant accounts
        (`tenant:{id}:deposits`, `tenant:{id}:revenue`, …).
      operationId: balance
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Balances per account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantBalance" }
        "404":
          description: No accounts for tenant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/payouts:
    post:
      tags: [payouts]
      summary: Cross-border payout of tenant earnings (code 104 + Mojaloop)
      description: |
        Executes a payout in two steps: (1) the Mojaloop rail
        (`POST /quotes` then `POST /transfers` against
        `MOJALOOP_ENDPOINT`, default `http://mojaloop:8444`) — if the rail
        rejects, no ledger movement happens; (2) the ledger payout transfer
        from tenant revenue to `platform:payouts`. The payout id derives
        from `idempotency_key`, making end-to-end retries idempotent.
        If step 2 fails after the rail committed, the service logs CRITICAL
        and the case requires operator reconciliation (see
        `docs/runbooks/operations.md`).
      operationId: payout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayoutBody" }
      responses:
        "201":
          description: Payout executed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutResponse" }
        "400":
          description: amount_cents must be > 0
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Insufficient revenue balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Mojaloop rail failure (no ledger movement)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /activities/hold-deposit:
    post:
      tags: [activities]
      summary: Saga activity — hold deposit (BookingSagaWorkflow HoldDeposit)
      description: |
        Invoked by the Temporal saga via Dapr service invocation. Transfer id
        is deterministic per booking (`saga-hold:{booking_id}`), so saga
        retries are idempotent.
      operationId: activityHoldDeposit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HoldDepositActivityBody" }
      responses:
        "201":
          description: Held deposit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepositResponse" }
        "400":
          description: amount_cents must be > 0
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /activities/void-hold:
    post:
      tags: [activities]
      summary: Saga compensation — void a deposit hold (VoidHold)
      description: |
        Invoked by the Temporal saga via Dapr service invocation. Voids the
        pending hold (full-amount refund against the pending transfer).
        Provide `deposit_id` or `booking_id` (the deposit id is then derived
        as `saga-hold:{booking_id}`). Transfer id is deterministic
        (`saga-void:{deposit_id}`).
      operationId: activityVoidHold
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VoidHoldActivityBody" }
      responses:
        "200":
          description: Voiding transfer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transfer" }
        "400":
          description: Neither deposit_id nor booking_id given
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/payments/flutterwave/initialize:
    post:
      tags: [flutterwave]
      summary: Initialize a Flutterwave checkout (deposit hold code 100 + checkout link)
      description: |
        Posts a deposit hold FIRST (code 100; deterministic hold id derived
        from `idempotency_key`, so retries replay idempotently end-to-end),
        then creates the Flutterwave v3 standard-checkout payment and
        returns the hosted checkout link. The rail commit is the webhook,
        not this call: `POST /webhooks/flutterwave` captures the hold
        (code 101) after server-side verification. Emits
        `com.opendesk.payments.FlutterwavePaymentInitialized` on
        `opendesk.payments.events` (best-effort outbox).
        Auth: tenant binding (`X-Internal-Token` service caller or gateway
        `X-Tenant-Slugs`) AND a money role (`X-User-Roles` ∩ MONEY_ROLES,
        default owner/admin; internal token exempt). NGN-only (P-13).
      operationId: flutterwaveInitialize
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FlutterwaveInitializeBody" }
      responses:
        "201":
          description: Checkout initialized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlutterwaveInitializeResponse" }
        "400":
          description: amount_cents = 0 / non-NGN currency / missing email /
            missing idempotency_key (P-12)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: No/invalid credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Tenant not bound to caller / money role required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Flutterwave initialize call failed (hold stays
            pending; retrying with the same idempotency_key replays)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: FLUTTERWAVE_SECRET_KEY not configured (fail-closed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /webhooks/flutterwave:
    post:
      tags: [webhooks]
      summary: Flutterwave charge webhook (verify-then-capture, code 101)
      description: |
        PUBLIC ingress — NOT behind the internal-token middleware; it
        self-authenticates via the `verif-hash` header compared in constant
        time against `FLUTTERWAVE_SECRET_HASH` (503 fail-closed when
        unconfigured, 401 on missing/invalid — no capture, no event).
        Only `event=charge.completed` with `data.status=successful` acts;
        anything else is acked as `ignored` so the provider stops retrying.
        Before capturing, the charge is verified server-side
        (`GET /transactions/{id}/verify`); only the VERIFIED amount may
        capture, and it must equal the hold amount (409 + NO state change on
        mismatch; 502 retryable when verification is unavailable — no state
        change, no event). The capture id is deterministic
        (`uuid-v5("fw-capture:{tx_ref}")`), so replays are idempotent: a
        duplicate delivery returns `already_captured` and never
        double-captures. On capture, `com.opendesk.payments.FlutterwavePaymentCaptured`
        is published to `opendesk.payments.events` RELIABLY (SPEC-W49 A1:
        retry-with-backoff, then a durable `payment_event_failures` record
        replayable via `POST /internal/events/replay`). See
        `docs/event-contracts.md` for the payload contract.
      operationId: flutterwaveWebhook
      parameters:
        - name: verif-hash
          in: header
          required: true
          description: Shared webhook secret (compared constant-time)
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FlutterwaveWebhookBody" }
      responses:
        "200":
          description: Acknowledged (`captured` / `already_captured` /
            `ignored` — the latter for non-charge events, unsuccessful
            charges, unknown tx_refs, or holds unknown to the ledger)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlutterwaveWebhookAck" }
        "400":
          description: Invalid webhook JSON
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing/invalid verif-hash (fail-closed; no state change)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Verified tx_ref/amount mismatch (NO state change)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Verification unavailable / missing data.id (retryable;
            NO state change)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: FLUTTERWAVE_SECRET_HASH not configured (fail-closed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /internal/events/replay:
    post:
      tags: [internal]
      summary: Replay durably-recorded failed payment events (SPEC-W49 A1)
      description: |
        K2-guarded (valid `X-Internal-Token` vs `PAYMENTS_INTERNAL_TOKEN`
        required; 401 mismatch, 503 when unconfigured). Re-publishes rows
        from `payment_event_failures` (capture events whose Dapr pubsub
        publication exhausted its retries) VERBATIM — same CloudEvent id, so
        idempotent consumers dedupe a replay against a late original — and
        deletes each row whose republication the broker accepted. Delivery
        is at-least-once. Select one row by `id`, or sweep by `tx_ref` /
        all (default limit 50, max 500).
      operationId: replayFailedPaymentEvents
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplayFailedEventsBody" }
      responses:
        "200":
          description: Replay outcome counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplayFailedEventsResponse" }
        "401":
          description: Missing/invalid X-Internal-Token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No recorded failure with the given id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Failure-log store error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: PAYMENTS_INTERNAL_TOKEN not configured (fail-closed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }

    FlutterwaveInitializeBody:
      type: object
      required: [tenant_id, amount_cents, currency, email, idempotency_key]
      properties:
        tenant_id: { type: string, example: "acme" }
        amount_cents:
          type: integer
          format: int64
          description: Minor units (kobo), > 0
          example: 125000
        currency:
          type: string
          description: NGN only until multi-currency lands (P-13)
          enum: [NGN]
        email: { type: string, format: email, description: Flutterwave customer email }
        booking_id: { type: string, description: Optional; round-trips in event payloads }
        idempotency_key:
          type: string
          description: REQUIRED (P-12); deterministically derives the hold id / tx_ref
        redirect_url:
          type: string
          format: uri
          description: Optional checkout redirect (falls back to FLUTTERWAVE_REDIRECT_URL)

    FlutterwaveInitializeResponse:
      type: object
      properties:
        tx_ref:
          type: string
          description: "`fw-{hold_uuid}`; booking-service persists this as payment_ref"
          example: "fw-9b0b0d52-1c8b-4d3f-9e2a-6f6a2b7c1d20"
        link: { type: string, format: uri, description: Hosted checkout URL }
        deposit_id: { type: string, description: Ledger hold (transfer) id, 32-char hex }

    FlutterwaveWebhookBody:
      type: object
      description: Flutterwave v3 webhook envelope (charge.completed).
      properties:
        event: { type: string, example: "charge.completed" }
        data:
          type: object
          properties:
            id: { type: integer, format: int64, description: Flutterwave transaction id (required for server-side verify) }
            status: { type: string, example: successful }
            tx_ref: { type: string, example: "fw-9b0b0d52-1c8b-4d3f-9e2a-6f6a2b7c1d20" }
            amount: { type: number, description: Major units (never trusted; verify API is authoritative) }
            currency: { type: string, example: NGN }
            meta:
              type: object
              properties:
                tenant_id: { type: string, description: Round-tripped from initialize (required) }
                booking_id: { type: string }

    FlutterwaveWebhookAck:
      type: object
      properties:
        status:
          type: string
          enum: [captured, already_captured, ignored]

    ReplayFailedEventsBody:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Replay exactly one recorded failure (takes precedence)
        tx_ref: { type: string, description: Sweep recorded failures for this tx_ref }
        limit:
          type: integer
          description: Max rows replayed (default 50, clamped to 1..500)

    ReplayFailedEventsResponse:
      type: object
      properties:
        replayed: { type: integer, description: Events republished + rows cleared }
        failed: { type: integer, description: Republication failures (rows retained) }

    Transfer:
      type: object
      description: Double-entry transfer. `id`/`pending_id` are u128 values;
        API-level ids (e.g. `deposit_id`) are the same value rendered as a
        32-char hex string.
      properties:
        id:
          description: u128 transfer id (JSON number; hex string elsewhere)
          oneOf:
            - { type: integer }
            - { type: string }
        debit_account: { type: string, example: "tenant:acme:deposits" }
        credit_account: { type: string, example: "tenant:acme:revenue" }
        amount: { type: integer, format: int64, description: minor units (cents) }
        ledger: { type: integer, format: int32 }
        code:
          type: integer
          description: 100 hold, 101 capture, 102 refund, 103 no-show fee, 104 payout
          enum: [100, 101, 102, 103, 104]
        state: { $ref: "#/components/schemas/TransferState" }
        flag: { $ref: "#/components/schemas/TransferFlag" }
        pending_id:
          description: u128 id of the pending transfer this resolves
          oneOf:
            - { type: integer }
            - { type: string }
        created_at: { type: string, format: date-time }

    TransferState:
      type: string
      enum: [pending, posted, voided]

    TransferFlag:
      type: string
      enum: [none, post_pending, void_pending]

    CaptureResult:
      type: object
      properties:
        post:
          $ref: "#/components/schemas/Transfer"
          description: Transfer that posted the pending hold
        revenue:
          $ref: "#/components/schemas/Transfer"
          description: Tenant revenue share of the captured amount
        platform_fee:
          $ref: "#/components/schemas/Transfer"
          description: Platform fee share (absent when fee is zero)

    AccountBalance:
      type: object
      properties:
        account: { type: string, example: "tenant:acme:deposits" }
        id: { type: string, description: Account id }
        debits_pending: { type: integer, format: int64 }
        credits_pending: { type: integer, format: int64 }
        debits_posted: { type: integer, format: int64 }
        credits_posted: { type: integer, format: int64 }
        posted_net:
          type: integer
          description: credits_posted − debits_posted (value held for tenant)
        pending_net:
          type: integer
          description: credits_pending − debits_pending

    TenantBalance:
      type: object
      properties:
        tenant_id: { type: string }
        accounts:
          type: array
          items: { $ref: "#/components/schemas/AccountBalance" }

    PartyIdInfo:
      type: object
      required: [party_id_type, party_identifier]
      properties:
        party_id_type:
          type: string
          example: MSISDN
          description: FSPIOP party id type (MSISDN, ALIAS, IBAN, …)
        party_identifier: { type: string, example: "+441234567890" }

    Money:
      type: object
      properties:
        currency: { type: string, example: USD }
        amount: { type: string, example: "125.00" }

    PayoutOutcome:
      type: object
      description: Mojaloop rail result (camelCase JSON)
      properties:
        quoteId: { type: string }
        transferId: { type: string }
        state: { type: string, example: COMMITTED }
        completedAt: { type: string, format: date-time }
        amount: { $ref: "#/components/schemas/Money" }

    HoldDepositBody:
      type: object
      required: [tenant_id, amount_cents]
      properties:
        tenant_id: { type: string }
        booking_id: { type: string }
        amount_cents: { type: integer, format: int64, minimum: 1 }
        currency: { type: string }
        idempotency_key: { type: string }

    DepositResponse:
      type: object
      properties:
        deposit_id: { type: string, description: 32-char hex transfer id }
        state: { $ref: "#/components/schemas/TransferState" }
        amount_cents: { type: integer, format: int64 }
        transfer: { $ref: "#/components/schemas/Transfer" }

    CaptureBody:
      type: object
      required: [tenant_id]
      properties:
        tenant_id: { type: string }
        amount_cents:
          type: integer
          format: int64
          description: Partial capture amount; omit to capture the full hold

    CaptureResponse:
      type: object
      properties:
        deposit_id: { type: string }
        result: { $ref: "#/components/schemas/CaptureResult" }

    RefundBody:
      type: object
      required: [tenant_id]
      properties:
        tenant_id: { type: string }
        deposit_id: { type: string, format: uuid }
        amount_cents:
          type: integer
          format: int64
          default: 0
          description: 0 = full remaining amount
        reason: { type: string }
        idempotency_key: { type: string }

    NoShowFeeBody:
      type: object
      required: [tenant_id, deposit_id, amount_cents]
      properties:
        tenant_id: { type: string }
        deposit_id: { type: string, format: uuid }
        amount_cents: { type: integer, format: int64, minimum: 1 }
        booking_id: { type: string }

    PayoutBody:
      type: object
      required: [tenant_id, amount_cents, currency, payee]
      properties:
        tenant_id: { type: string }
        amount_cents: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, example: USD }
