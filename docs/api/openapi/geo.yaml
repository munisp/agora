openapi: 3.0.3
info:
  title: OpenDesk geo-service API
  version: "1.0.0"
  description: |
    REST API of `geo-service` (Rust, axum + terrio) — administrative/custom
    boundary ingest into the booking PostGIS database, point-in-polygon
    enrichment (coords -> state/lga/ward), and self-hosted PMTiles tile/style
    serving (SPEC-W52 Scope A).

    Generated from `services/geo-service/src/*.rs`.

    ## Tenancy & authz
    * Tenant context via the `X-Tenant-Slug` header (house idiom). On this
      platform the header value used by geo-service is the tenant UUID (the
      Permify organization id / RLS `app.tenant_id` value). A missing or
      non-uuid header means "no tenant context": reads (enrich) fall back to
      platform reference data only, tenant-scope writes 400.
    * Boundary import (BOTH scopes — reference rows are world-visible, so
      reference imports require the same perm) is gated by a Permify
      `manage_bookings` check on `organization:{tenant_id}` for
      `user:{sub}` (the gateway-injected `X-User-Id`). `AUTHZ_DISABLED=true`
      is the dev bypass; `PERMIFY_URL` empty disables the gate (dev escape,
      boot WARN — billing-engine idiom). Never set in production.
    * The gateway route `api-geo` (`/api/geo/*`) validates the Keycloak JWT
      (`openid-connect`, realm `opendesk`, client `admin-web`, bearer_only)
      and strips the `/api/geo` prefix. `NEXT_PUBLIC_GEO_STYLE_URL` defaults
      to `/api/geo/style.json`, which lands on the service's `/style.json`
      alias.

    ## RLS
    `geo_boundaries` runs ENABLE+FORCE ROW LEVEL SECURITY with the
    NULL-reference `tenant_isolation` variant: `tenant_id IS NULL` rows are
    platform reference data visible to every tenant; tenant rows are visible
    only under the transaction-local `app.tenant_id` GUC (set via
    `set_config(..., true)` per transaction — see src/store.rs).

    ## Errors
    `{"error": "<message>"}` JSON (tiles/style use plain text). Status map:
    400 invalid input (bad params, non-uuid tenant on tenant scope),
    401 caller identity required (live authz without `X-User-Id`),
    403 Permify denial, 404 tile not in the archive,
    409 conflict (reserved; imports UPSERT instead of conflicting),
    413 payload over the 100 MB import cap,
    415 AV scan verdict INFECTED (`{"error":"infected","signature":...}`) or
    unsupported gazetteer-import content type,
    422 unparseable/unsupported file or CRS,
    500 internal (DB) error,
    502 upstream failure (Permify or `{url}` fetch),
    503 disabled/unavailable config (GEO_TILES_PATH unset for tiles/style;
    `{"error":"av_unavailable"}` when the malware scanner is unreachable and
    CLAMAV_REQUIRED=true).

    ## Gazetteer (SPEC-W63)
    `geo_places` holds the offline gazetteer: platform reference states /
    LGAs / localities (locality tier is schema + import support only, seeded
    EMPTY — gate G3). Same NULL-reference RLS variant as `geo_boundaries`;
    reads are unauthenticated-tenant (reference rows are world-visible),
    import is Permify-gated like boundary import and AV-scanned pre-parse
    (both geo import paths; Infected => 415, scanner unreachable =>
    503 `av_unavailable` when CLAMAV_REQUIRED=true, else logged + skipped).
    Codes: states `NG-<STATE>`, LGAs `NG-<STATE>-<LGA>` with the pinned slug
    rule (uppercase, spaces/'/' -> '-', strip other punctuation); localities
    importer-assigned. Boot seeds 37 states (incl. FCT) + 774 LGAs from the
    bundled `nigeria_gazetteer.csv` behind GEO_GAZETTEER_SEED (default true).

    ## No-hit behavior (enrich)
    A point covered by no boundary is NOT an error: 200 with
    `{"state":null,"lga":null,"ward":null,"boundaries":[]}` (chosen over 404 —
    Scope B's fail-open client treats 4xx as "skip enrichment").
paths:
  /healthz:
    get:
      summary: Liveness probe (APISIX upstream health check)
      operationId: healthz
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ok}
  /v1/geo/boundaries/import:
    post:
      summary: Import boundaries from GeoJSON/Shapefile(zip)/GeoPackage or a URL
      operationId: importBoundaries
      description: |
        Multipart file (`.geojson` / `.json` / `.gpkg` / `.zip` shapefile) OR
        `{url}` (multipart field or JSON body). Parsed by terrio; non-4326
        layers are reprojected via terrio's CRS engine (a CRS-less layer is
        EPSG:4326 per RFC 7946; WKT-only CRS without an EPSG code is 422).
        Only Polygon/MultiPolygon features import (others count as
        `skipped`). Insert is one transaction with a per-row savepoint;
        upsert on (scope-tenant, kind, code). Caps: 50k features / 100 MB.
      parameters:
        - in: header
          name: X-Tenant-Slug
          required: true
          schema: {type: string, format: uuid}
          description: Tenant uuid — the Permify organization for the authz check; the row owner for scope=tenant.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: .geojson/.json/.gpkg/.zip (shapefile) payload (mutually exclusive with `url`)
                url: {type: string, format: uri, description: http(s) URL of the same formats (mutually exclusive with `file`)}
                kind: {type: string, enum: [state, lga, ward, custom]}
                name_field: {type: string, description: attribute carrying the boundary name}
                code_field: {type: string, description: attribute carrying the boundary code (upsert key)}
                source: {type: string, description: provenance label (e.g. "geoBoundaries CC-BY-4.0")}
                scope: {type: string, enum: [reference, tenant], default: reference}
              required: [kind, name_field, code_field]
          application/json:
            schema:
              type: object
              properties:
                url: {type: string, format: uri}
                kind: {type: string, enum: [state, lga, ward, custom]}
                name_field: {type: string}
                code_field: {type: string}
                source: {type: string}
                scope: {type: string, enum: [reference, tenant], default: reference}
              required: [url, kind, name_field, code_field]
      responses:
        "200":
          description: Import summary (per-row problems are reported, not fatal)
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported: {type: integer}
                  skipped: {type: integer, description: features lacking geometry/name/code or non-polygon}
                  errors:
                    type: array
                    items: {type: string}
                    description: advisory per-feature/per-row messages (capped at 100)
                required: [imported, skipped, errors]
        "400": {description: invalid params (kind/name_field/code_field/scope, non-uuid tenant on scope=tenant, missing tenant header)}
        "401": {description: live authz without caller identity (X-User-Id)}
        "403": {description: Permify manage_bookings denial}
        "413": {description: payload over the 100 MB cap}
        "422": {description: unsupported extension, unparseable file, unsupported/WKT-only CRS, or empty feature set}
        "500": {description: database error}
        "502": {description: "Permify outage (fail-closed) or {url} fetch failure"}
  /v1/geo/enrich:
    get:
      summary: Point-in-polygon enrichment (coords -> state/lga/ward + covering boundaries)
      operationId: enrichPoint
      description: |
        `ST_Covers` over reference boundaries first, then the caller's tenant
        custom rows (RLS-scoped). Reference hits win state/lga/ward; tenant
        rows only fill slots the reference pass left empty and append to
        `boundaries`. No hit is 200 with nulls (see "No-hit behavior").
      parameters:
        - in: query
          name: lat
          required: true
          schema: {type: number, minimum: -90, maximum: 90}
        - in: query
          name: lng
          required: true
          schema: {type: number, minimum: -180, maximum: 180}
        - in: header
          name: X-Tenant-Slug
          required: false
          schema: {type: string, format: uuid}
          description: Tenant uuid; absent/non-uuid = reference data only.
      responses:
        "200":
          description: Enrichment result (nulls + empty array when no boundary covers the point)
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: {type: [string, "null"]}
                  lga: {type: [string, "null"]}
                  ward: {type: [string, "null"]}
                  boundaries:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: {type: string, enum: [state, lga, ward, custom]}
                        name: {type: string}
                        code: {type: string}
                      required: [kind, name, code]
                required: [state, lga, ward, boundaries]
        "400": {description: missing/out-of-range lat/lng}
        "500": {description: database error}
  /v1/geo/tiles/{z}/{x}/{y}.mvt:
    get:
      summary: Vector tile from the self-hosted PMTiles archive (GEO_TILES_PATH)
      operationId: getTile
      description: |
        Read in place from the archive via terrio's tiles reader (header +
        the tiles needed only). FAIL-CLOSED: 503 with a plain-text error when
        GEO_TILES_PATH is unset or the archive is unreadable — provisioning
        is an operator action; a client must never see synthetic tiles. A
        raster (non-MVT) archive answers 404 (this contract is vector tiles).
      parameters:
        - {in: path, name: z, required: true, schema: {type: integer, minimum: 0, maximum: 24}}
        - {in: path, name: x, required: true, schema: {type: integer, minimum: 0}}
        - {in: path, name: "y", required: true, schema: {type: integer, minimum: 0}}
      responses:
        "200":
          description: The tile (Cache-Control public, max-age=300)
          content:
            application/vnd.mapbox-vector-tile:
              schema: {type: string, format: binary}
        "404": {description: no such tile in the archive / archive is not MVT}
        "503": {description: GEO_TILES_PATH unset or archive unreadable (plain text)}
  /v1/geo/style.json:
    get:
      summary: MapLibre style generated from the PMTiles archive metadata
      operationId: getStyle
      description: |
        Vector source "geo" (bounds/minzoom/maxzoom from the archive) + a
        background layer + a fill/line pair per declared vector layer. The
        tiles URL is RELATIVE (`tiles/{z}/{x}/{y}.mvt`) so the same style
        works from /api/geo/style.json and /api/geo/v1/geo/style.json. No
        glyphs are referenced (no glyph server this wave). Also served at the
        `/style.json` alias for the /api/geo gateway strip shape.
      responses:
        "200":
          description: MapLibre style document
          content:
            application/json:
              schema: {type: object}
        "404": {description: archive is not MVT}
        "503": {description: GEO_TILES_PATH unset or archive unreadable (plain text)}
  /v1/geo/gazetteer:
    get:
      summary: Search/list reference gazetteer places (SPEC-W63)
      operationId: searchGazetteer
      description: |
        Reference rows only (world-visible under the NULL-reference RLS
        policy). `q` is a case-insensitive substring on name/code; `state`
        scopes results to a state — accepts a name ("Lagos"), slug, or code
        ("NG-LAGOS") — matching the state row itself plus LGAs
        (`parent_code = NG-<STATE>`) and localities (`parent_code` prefix).
        Results are capped (`limit`, default 200, max 2000); use the
        snapshot endpoint for a full dump.
      parameters:
        - {in: query, name: kind, required: false, schema: {type: string, enum: [state, lga, locality]}}
        - {in: query, name: state, required: false, schema: {type: string}, description: state name or code (NG-<STATE>)}
        - {in: query, name: q, required: false, schema: {type: string}, description: case-insensitive substring on name/code}
        - {in: query, name: limit, required: false, schema: {type: integer, default: 200, maximum: 2000}}
      responses:
        "200":
          description: Matching places
          content:
            application/json:
              schema:
                type: object
                properties:
                  places:
                    type: array
                    items: {$ref: "#/components/schemas/Place"}
                  count: {type: integer}
                required: [places, count]
        "400": {description: invalid kind}
        "500": {description: database error}
  /v1/geo/gazetteer/snapshot:
    get:
      summary: Full reference gazetteer dump with content-hash ETag (SPEC-W63)
      operationId: gazetteerSnapshot
      description: |
        Canonical JSON body (fixed field order, no whitespace, explicit
        nulls) so the ETag — sha256 of the exact body bytes — is byte-stable
        for a given row set. `levels` is a comma-separated subset of
        state,lga,locality (default: all; order-insensitive). Send
        `If-None-Match` with the stored ETag: a match answers 304 with an
        empty body (the field-pwa offline-sync revalidation path). Responses
        carry `Cache-Control: no-cache` (store but revalidate).
      parameters:
        - {in: query, name: levels, required: false, schema: {type: string, example: "state,lga"}}
        - {in: header, name: If-None-Match, required: false, schema: {type: string}}
      responses:
        "200":
          description: The snapshot (ETag header = quoted sha256 of the body)
          headers:
            ETag: {schema: {type: string}, description: '"<sha256 hex of body>"'}
            Cache-Control: {schema: {type: string, example: no-cache}}
          content:
            application/json:
              schema:
                type: object
                properties:
                  levels:
                    type: array
                    items: {type: string, enum: [state, lga, locality]}
                  places:
                    type: array
                    items: {$ref: "#/components/schemas/Place"}
                required: [levels, places]
        "304": {description: If-None-Match matched; empty body, ETag header repeated}
        "400": {description: invalid levels}
        "500": {description: database error}
  /v1/geo/gazetteer/import:
    post:
      summary: Import gazetteer places from CSV/GeoJSON/JSON (SPEC-W63)
      operationId: importGazetteer
      description: |
        Multipart `file` (`.csv`/`.geojson`/`.json`) or `url` field, raw
        `text/csv` / `application/geo+json` bodies, or JSON (a places array /
        `{"places":[...]}` / FeatureCollection / `{"url": ...}`). CSV
        requires a header row with at least `kind` and `name`; `code` is
        derived when empty (state -> `NG-<NAME>`, lga/locality ->
        `<PARENT_CODE>-<NAME>`, parent required). GeoJSON Point geometries
        fill lat/lng; other geometries import without coordinates. Rows are
        reference rows (tenant_id NULL); upsert on (kind, code) in one
        transaction with a per-row savepoint (bad rows land in `errors[]`).
        Caps: 200k rows / 100 MB. Gated by Permify manage_bookings and
        AV-scanned pre-parse (Infected => 415; scanner unreachable =>
        503 `av_unavailable` when CLAMAV_REQUIRED=true, else logged + skipped).
      parameters:
        - in: header
          name: X-Tenant-Slug
          required: true
          schema: {type: string, format: uuid}
          description: Tenant uuid — the Permify organization for the authz check.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: {type: string, format: binary, description: .csv/.geojson/.json payload}
                url: {type: string, format: uri, description: http(s) URL of the same (mutually exclusive with file)}
                format: {type: string, enum: [csv, geojson, json], description: explicit format override}
                source: {type: string, description: default provenance label for rows without one}
          text/csv:
            schema: {type: string, description: header row kind,code,name,parent_code,lat,lng,source}
          application/geo+json:
            schema: {type: object, description: "FeatureCollection; properties carry kind/code/name/parent_code/source"}
          application/json:
            schema: {type: object, description: 'places array / {"places":[...]} / FeatureCollection / {"url": ...}'}
      responses:
        "200":
          description: Import summary (per-row problems are reported, not fatal)
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported: {type: integer}
                  skipped: {type: integer}
                  errors:
                    type: array
                    items: {type: string}
                    description: advisory per-row messages (capped at 100)
                required: [imported, skipped, errors]
        "400": {description: invalid params / missing X-Tenant-Slug}
        "401": {description: live authz without caller identity (X-User-Id)}
        "403": {description: Permify manage_bookings denial}
        "413": {description: payload over the 100 MB cap}
        "415": {description: 'AV scan verdict infected: {"error":"infected","signature":...}; or unsupported content type'}
        "422": {description: unparseable payload or no importable rows}
        "500": {description: database error}
        "502": {description: "Permify outage (fail-closed) or {url} fetch failure"}
        "503": {description: 'AV scanner unreachable with CLAMAV_REQUIRED=true: {"error":"av_unavailable"}'}
components:
  schemas:
    Place:
      type: object
      properties:
        kind: {type: string, enum: [state, lga, locality]}
        code: {type: string, example: NG-LAGOS-IKEJA}
        name: {type: string, example: Ikeja}
        parent_code: {type: [string, "null"], example: NG-LAGOS}
        lat: {type: [number, "null"]}
        lng: {type: [number, "null"]}
        source: {type: string, example: "nigeria_lgas.csv (public)"}
      required: [kind, code, name, parent_code, lat, lng, source]
