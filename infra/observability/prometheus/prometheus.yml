# Prometheus scrape config for the OpenDesk dev/prod-compose topology.
# All targets resolve over the `opendesk` docker network by service name.
#
# APISIX note: the prometheus plugin exports on its own port (9091, path
# /apisix/prometheus/metrics), NOT the 9080 data-plane port — see
# infra/apisix/config.yaml `plugin_attr.prometheus.export_addr`.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: opendesk

# GF13 (SPEC-W34): alert rules live in rules.yml (mounted alongside this file;
# see infra/docker-compose.observability.yml). There is NO Alertmanager by
# design: the platform's alert transport is the Kafka topic
# `opendesk.ops.alerts` (K3/SPEC-W44; the legacy unprefixed `ops.alerts`
# topic is retired — see infra/kafka/create-topics.sh). Services publish
# structured alerts there directly. These rules surface in
# Prometheus / Grafana's alert view as the signal layer.
rule_files:
  - rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ---- Application services (all expose /metrics on their app port) ----
  # SPEC-W44 F15-02 reconciliation (verified against the mirror at W44):
  # identity/booking/notification/payments/conversation/knowledge did NOT yet
  # serve /metrics at the W44 baseline — the jobs are RETAINED by contract
  # (F15-02: do not remove): W44 service work orders (W-I/W-B/W-N/W-P/W-A)
  # add /metrics on exactly these app ports, so the targets flip from DOWN to
  # UP as those land. If a verifier confirms at gate time that a service
  # still lacks /metrics, comment out that single job with a note — never
  # delete the block.
  - job_name: identity
    static_configs:
      - targets: ["identity:7001"]
  - job_name: booking
    static_configs:
      - targets: ["booking:7002"]
  - job_name: notification
    static_configs:
      - targets: ["notification:7003"]
  - job_name: payments
    static_configs:
      - targets: ["payments:7004"]
  - job_name: gateway-edge
    static_configs:
      - targets: ["edge:7005"]
  - job_name: voice
    static_configs:
      - targets: ["voice:7006"]
  - job_name: conversation
    static_configs:
      - targets: ["conversation:7007"]
  - job_name: knowledge
    static_configs:
      - targets: ["knowledge:7008"]
  - job_name: analytics
    static_configs:
      - targets: ["analytics:7009"]
  - job_name: crm-sync
    static_configs:
      - targets: ["crm-sync:7010"]

  # ---- voice-worker (SPEC-W44 F15-09) ----
  # The LiveKit worker process serves /metrics (prometheus_client) on its OWN
  # port (VOICE_WORKER_METRICS_PORT, default 9464 — set in the root compose
  # voice-worker service; the server is added in W44 W-A). Profile-gated
  # (`--profile voice`): target DOWN is expected in the base stack.
  - job_name: voice-worker
    static_configs:
      - targets: ["voice-worker:9464"]

  # ---- model-registry (GF13/SPEC-W34) ----
  # Profile-gated compose service (`--profile model-registry`, port 7019,
  # infra/docker-compose.core.yml): the target is simply DOWN when the
  # profile is disabled — expected in the base stack. Emits
  # opendesk_model_drift_psi (see rules.yml ModelDriftPSIHigh).
  - job_name: model-registry
    static_configs:
      - targets: ["model-registry:7019"]

  # ---- APISIX gateway (prometheus plugin, see header note) ----
  - job_name: apisix
    metrics_path: /apisix/prometheus/metrics
    static_configs:
      - targets: ["apisix:9091"]

  # ---- OTel collector prometheus exporter (OTLP -> prometheus bridge) ----
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
