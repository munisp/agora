version: 2

sources:
  - name: bronze
    description: >
      Raw Iceberg namespace populated by analytics-pipeline Kafka consumers
      (SPEC §13). Assumed columns documented here and in dbt_project.yml.
    database: iceberg
    schema: bronze
    tables:
      - name: booking_events
        description: One row per CloudEvents booking event (raw sink).
        columns:
          - name: event_id
            description: CloudEvents envelope id.
            tests: [not_null]
          - name: event_type
            description: BookingCreated|BookingConfirmed|BookingRescheduled|BookingCancelled|BookingNoShow
            tests: [not_null]
          - name: tenant_id
            tests: [not_null]
          - name: booking_id
            tests: [not_null]
          - name: status
          - name: source
          - name: price_cents
          - name: currency
          - name: starts_at
          - name: occurred_at
            tests: [not_null]
          - name: offering_id
            description: Offering the booking belongs to (SPEC-W3 §3 revenue intelligence).
      - name: transcripts
        description: One row per ConversationTurn (PII-redacted by Fluvio smart module).
        columns:
          - name: conversation_id
            tests: [not_null]
          - name: tenant_id
            tests: [not_null]
          - name: role
            description: user|agent|human_agent|system|tool (any case in bronze).
          - name: text
          - name: ts
            tests: [not_null]
          - name: audio_url
      - name: payment_events
        description: One row per payment/ledger event.
        columns:
          - name: event_id
            tests: [not_null]
          - name: event_type
          - name: tenant_id
            tests: [not_null]
          - name: booking_id
          - name: amount_cents
            tests: [not_null]
          - name: currency
          - name: transfer_code
            description: TigerBeetle code 100 hold / 101 capture / 102 refund / 103 no-show fee / 104 payout.
          - name: ledger_ref
          - name: occurred_at
            tests: [not_null]
      - name: usage_events
        description: >
          One row per usage metering record (Wave 5 #9) emitted on
          opendesk.usage.events as {tenant_id, metric, value, ts, meta}.
          Sparse by design: v1 metrics are booking + call-minute counts.
        columns:
          - name: event_id
          - name: tenant_id
            tests: [not_null]
          - name: metric
            description: v1 emits 'booking' (1 per lifecycle event); call-minutes/ai_tokens/messages planned
            tests: [not_null]
          - name: value
            description: Usage amount (double; call-minutes are fractional).
            tests: [not_null]
          - name: occurred_at
            tests: [not_null]
          - name: meta
            description: Free-form JSON metadata (stringified).
      - name: receipt_documents
        description: >
          One row per OCR'd receipt document (W62; analytics-pipeline consumes
          opendesk.ocr.events). PII posture (G1): kyc_* kinds are dropped
          entirely and only whitelisted scalars from extracted_fields
          (amount_minor/currency/receipt_date) plus hash-only identifiers
          (sha256/phash) land — NO free text (vendor/note/items).
        columns:
          - name: event_id
            description: CloudEvents envelope id.
            tests: [not_null]
          - name: tenant_id
            tests: [not_null]
          - name: document_id
            tests: [not_null]
          - name: kind
            description: OCR document kind; mapper lands kind='receipt' only.
          - name: status
          - name: page_count
          - name: sha256
            description: Hash-only document identifier.
          - name: phash
            description: Hash-only perceptual hash.
          - name: model_version
          - name: amount_minor
            description: Whitelisted scalar from extracted_fields (nullable).
          - name: currency
            description: ISO-3 (nullable).
          - name: receipt_date
            description: YYYY-MM-DD string (nullable).
          - name: occurred_at
            tests: [not_null]
      - name: receipt_recon_findings
        description: >
          One row per ReceiptReconFinding event (W62 G2: routed to this
          dedicated table instead of bronze.booking_events). Full finding
          payload — kind, confidence, expected/captured amounts, currency;
          booking_id is nullable (payment_without_receipt may lack one).
        columns:
          - name: event_id
            description: CloudEvents envelope id.
            tests: [not_null]
          - name: tenant_id
            tests: [not_null]
          - name: run_id
            # run_id NULL until booking-service enriches findingEventPayload (follow-up)
            description: Recon sweep run id (nullable on live payloads).
          - name: finding_kind
            description: receipt_without_payment|payment_without_receipt|amount_mismatch|currency_unknown
          - name: confidence
            description: exact|heuristic|none
          - name: capture_client_id
            description: Field-capture client id (nullable).
          - name: booking_id
            description: Nullable uuid string.
          - name: attempt_tx_ref
          - name: expected_amount_minor
          - name: captured_amount_minor
          - name: receipt_amount_major
          - name: receipt_currency
          - name: occurred_at
            tests: [not_null]

models:
  - name: stg_booking_events
    description: Standardized booking events (silver view).
    columns:
      - name: event_id
        tests:
          - not_null
          - unique
      - name: tenant_id
        tests: [not_null]
      - name: event_type
        tests:
          - accepted_values:
              arguments:
                values: ['bookingcreated', 'bookingconfirmed', 'bookingrescheduled', 'bookingcancelled', 'bookingnoshow']
      - name: source
        tests:
          - accepted_values:
              arguments:
                values: ['web', 'voice', 'chat', 'unknown']
      - name: event_day
        tests: [not_null]

  - name: stg_transcripts
    description: Standardized transcript turns (silver view).
    columns:
      - name: conversation_id
        tests: [not_null]
      - name: tenant_id
        tests: [not_null]
      - name: role
        tests:
          - accepted_values:
              arguments:
                values: ['user', 'agent', 'human_agent', 'system', 'tool']

  - name: stg_receipt_documents
    description: >
      Standardized OCR receipt documents (silver view, W62). Only
      kind='receipt' documents land in bronze (kyc_* dropped, G1); hash-only
      identifiers + whitelisted scalars, no free text.
    columns:
      - name: event_id
        tests:
          - not_null
          - unique
      - name: tenant_id
        tests: [not_null]
      - name: document_id
        tests: [not_null]
      - name: kind
        tests:
          - accepted_values:
              arguments:
                values: ['receipt']
      - name: event_day
        tests: [not_null]

  - name: stg_receipt_recon_findings
    description: >
      Standardized receipt-reconciliation findings (silver view, W62 G2) —
      one row per ReceiptReconFinding routed to its own bronze table.
      finding_kind/confidence are lowercased closed enums; booking_id stays
      nullable (payment_without_receipt findings may have no booking).
    columns:
      - name: event_id
        tests:
          - not_null
          - unique
      - name: tenant_id
        tests: [not_null]
      - name: run_id
        # run_id NULL until booking-service enriches findingEventPayload (follow-up)
        description: Recon sweep run id (nullable on live payloads).
      - name: finding_kind
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['receipt_without_payment', 'payment_without_receipt', 'amount_mismatch', 'currency_unknown']
      - name: confidence
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['exact', 'heuristic', 'none']
      - name: booking_id
        description: Nullable — payment_without_receipt findings may lack one.
      - name: finding_day
        tests: [not_null]
