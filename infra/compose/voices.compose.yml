# Voice TTS sidecars (SPEC-W10 Part B) — OPTIONAL compose override.
#
# Adds the MMS (Nigerian/African languages, :5800) and XTTS (voice cloning,
# :5810) sidecars consumed by voice-agent-runtime's tts_providers. NOT part of
# the base stack; start as an override on top of the root compose:
#
#   docker compose -f docker-compose.yml -f infra/compose/voices.compose.yml up -d
#
# Both services run REAL inference when started via THIS compose file
# (W39 SIM-013 / SPEC-W44 F16-4 — single source of truth):
#   MMS_MOCK / XTTS_MOCK default to 0 HERE (explicit `${VAR:-0}` below) —
#   compose is authoritative for deployments.
#   NOTE the deliberate asymmetry: the code-level default in
#   services/mms-tts / services/xtts-tts is MOCK ON ("1") so that bare
#   pytest/e2e runs never download model checkpoints; running the sidecars
#   outside this compose (or setting the vars to 1 here) selects the mock:
#   MMS_MOCK=1  deterministic sine wav, no model downloads (e2e only)
#   XTTS_MOCK=1 same posture (e2e only; real XTTS needs a GPU, >=6GB VRAM —
#                build the CUDA variant per services/xtts-tts/Dockerfile and
#                uncomment the deploy block below)
# Real mode: MMS CPU is fine; checkpoints ~100-250MB/lang cached in mms-models.
# Point the runtime at these services via MMS_TTS_URL / XTTS_TTS_URL
# (defaults http://mms-tts:5800 / http://xtts-tts:5810).

services:
  mms-tts:
    build:
      context: ../../services/mms-tts
    image: opendesk/mms-tts:dev
    container_name: opendesk-mms-tts
    restart: unless-stopped
    ports:
      - "5800:5800"
    environment:
      # W39 SIM-013: safe default OFF. DEV ONLY — mock TTS: set MMS_MOCK=1
      # explicitly in the environment for e2e (deterministic sine wav, no
      # model downloads). NEVER set in production.
      MMS_MOCK: ${MMS_MOCK:-0}
      # Real-mode per-language allow-list (facebook/mms-tts-{lang}).
      # All five: eng,pcm,yor,ibo,hau
      MMS_LANGS: ${MMS_LANGS:-eng,pcm}
      HF_HOME: /models
    volumes:
      - mms-models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5800/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Joins the `opendesk` network defined by the root docker-compose.yml
    # (no re-declaration needed when used as a -f override).
    networks:
      - opendesk

  xtts-tts:
    build:
      context: ../../services/xtts-tts
    image: opendesk/xtts-tts:dev
    container_name: opendesk-xtts-tts
    restart: unless-stopped
    ports:
      - "5810:5810"
    environment:
      # W39 SIM-013: safe default OFF. DEV ONLY — mock TTS: set XTTS_MOCK=1
      # explicitly for e2e (no GPU needed). NEVER set in production.
      XTTS_MOCK: ${XTTS_MOCK:-0}
      VOICES_DIR: /data
      # Real mode: persist the ~1.8GB XTTS-v2 checkpoint on the volume too.
      # TTS_HOME: /data/models
    volumes:
      - xtts-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5810/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # XTTS GPU mode (uncomment together with the Dockerfile CUDA block +
    # XTTS_MOCK=0):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    networks:
      - opendesk

volumes:
  mms-models:
  xtts-data:
