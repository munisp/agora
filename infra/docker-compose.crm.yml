# OpenDesk CRM plane (SPEC-CRM §A): self-hosted Twenty CRM + dedicated Redis.
# Included by the root docker-compose.yml via `include:`.
#
# Image tag note: pinned to twentycrm/twenty:v1.3.2 per SPEC-CRM §A. If that
# tag is unavailable on Docker Hub, fall back to `twentycrm/twenty:v1.3.1`
# (confirmed to exist) or `:latest` — see services/crm-sync-service/README.md.

networks:
  opendesk:
    driver: bridge

volumes:
  twenty-local-storage:
  twenty-redis-data:
  chatwoot-storage:
  chatwoot-redis-data:

x-twenty-env: &twenty-env
  NODE_PORT: "3000"
  PG_DATABASE_URL: postgres://opendesk:opendesk@postgres:5432/twenty
  REDIS_URL: redis://twenty-redis:6379
  SERVER_URL: ${TWENTY_SERVER_URL:-http://localhost:3100}
  FRONT_BASE_URL: ${TWENTY_FRONT_BASE_URL:-http://localhost:3100}
  # DEV ONLY token/app secrets (W39 SIM-025/026/045): these defaults match
  # .env.example verbatim so the dev stack boots without a .env. They are
  # PUBLIC knowledge — production MUST override every one via the secrets
  # store (docs/runbooks/secrets.md).
  ACCESS_TOKEN_SECRET: ${TWENTY_ACCESS_TOKEN_SECRET:-opendesk-twenty-access-token-dev}
  LOGIN_TOKEN_SECRET: ${TWENTY_LOGIN_TOKEN_SECRET:-opendesk-twenty-login-token-dev}
  REFRESH_TOKEN_SECRET: ${TWENTY_REFRESH_TOKEN_SECRET:-opendesk-twenty-refresh-token-dev}
  FILE_TOKEN_SECRET: ${TWENTY_FILE_TOKEN_SECRET:-opendesk-twenty-file-token-dev}
  APP_SECRET: ${TWENTY_APP_SECRET:-opendesk-twenty-app-secret-dev}
  MESSAGE_QUEUE_TYPE: bull-mq
  STORAGE_TYPE: local
  SIGN_IN_PREFILLED: "true"

x-chatwoot-env: &chatwoot-env
  # SPEC-W118: Chatwoot CE (human-agent console). Uses the SHARED postgres
  # with its own database (third-party app, same trust model as Twenty) +
  # a dedicated Redis. DEV ONLY secret default matches .env.example —
  # production MUST override via the secrets store.
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DATABASE: chatwoot
  POSTGRES_USERNAME: opendesk
  POSTGRES_PASSWORD: opendesk
  REDIS_URL: redis://chatwoot-redis:6379
  SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE:-opendesk-chatwoot-secret-key-base-dev-change-in-prod-0123456789abcdef0123456789abcdef}
  RAILS_ENV: production
  NODE_ENV: production
  RAILS_LOG_TO_STDOUT: "true"
  FRONTEND_URL: ${CHATWOOT_FRONTEND_URL:-http://localhost:3120}

# ---------------------------------------------------------------------------
# W46-I (P-DATA C-01/C-02): shared anchors applied to EVERY service below.
#   x-logging        — bound the json-file driver (was UNBOUNDED: a chatty
#                      container could fill the host disk).
#   x-deploy-limits  — default CPU/memory cap (compose v2 enforces
#                      deploy.resources.limits outside swarm). One runaway
#                      service (ollama/keycloak/temporal) can no longer
#                      starve Postgres/API of memory. Per-service overrides:
#                      postgres 2G/2.0, redis 512M/0.5, ollama* 4G, and a few
#                      JVM/big-process services at 2G (see anchor comment).
# ---------------------------------------------------------------------------
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"
x-deploy-limits: &default-limits
  resources:
    limits:
      cpus: "1.0"
      memory: 1G

services:

  # ---------------- Twenty API (SPEC-CRM §A) ----------------
  twenty-api:
    logging: *default-logging
    deploy: *default-limits
    image: twentycrm/twenty:v1.3.2
    container_name: twenty-api
    restart: unless-stopped
    environment: *twenty-env
    ports:
      - "3100:3000"
    volumes:
      - twenty-local-storage:/app/packages/twenty-server/.local-storage
    depends_on:
      postgres:
        condition: service_healthy
      twenty-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz >/dev/null 2>&1 || curl -fsS http://localhost:3000/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks: [opendesk]

  # ---------------- Twenty worker (bull-mq jobs) ----------------
  twenty-worker:
    logging: *default-logging
    deploy: *default-limits
    image: twentycrm/twenty:v1.3.2
    container_name: twenty-worker
    restart: unless-stopped
    command: ["yarn", "worker:prod"]
    environment: *twenty-env
    volumes:
      - twenty-local-storage:/app/packages/twenty-server/.local-storage
    depends_on:
      twenty-api:
        condition: service_started
      twenty-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f worker >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [opendesk]

  # ---------------- Dedicated Redis for Twenty's bull-mq queue ----------------
  twenty-redis:
    logging: *default-logging
    # W46-I C-01 override: sized above the 1G/1.0 default (see anchor comment).
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    image: redis:7-alpine
    container_name: twenty-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - twenty-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [opendesk]

  # ---------------- Chatwoot rails (SPEC-W118): agent console UI ----------------
  chatwoot-rails:
    logging: *default-logging
    deploy: *default-limits
    image: chatwoot/chatwoot:v4.18.0
    container_name: chatwoot-rails
    restart: unless-stopped
    environment: *chatwoot-env
    # Third-party UI app (like Twenty :3100) — the ONLY published port of
    # the W118 stack; the bridge itself stays network-internal (GF4).
    ports:
      - "3120:3000"
    volumes:
      - chatwoot-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      chatwoot-redis:
        condition: service_healthy
      chatwoot-prepare:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 >/dev/null 2>&1 || curl -fsS http://localhost:3000 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks: [opendesk]

  # ---------------- Chatwoot sidekiq (jobs: webhooks, mailers) ----------------
  chatwoot-sidekiq:
    logging: *default-logging
    deploy: *default-limits
    image: chatwoot/chatwoot:v4.18.0
    container_name: chatwoot-sidekiq
    restart: unless-stopped
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    environment: *chatwoot-env
    volumes:
      - chatwoot-storage:/app/storage
    depends_on:
      chatwoot-rails:
        condition: service_started
      chatwoot-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f sidekiq >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [opendesk]

  # ---------------- Chatwoot one-shot DB prepare (migrations + seed) ----------------
  chatwoot-prepare:
    logging: *default-logging
    image: chatwoot/chatwoot:v4.18.0
    container_name: chatwoot-prepare
    restart: "no"
    command: ["bundle", "exec", "rails", "db:chatwoot_prepare"]
    environment: *chatwoot-env
    depends_on:
      postgres:
        condition: service_healthy
      chatwoot-redis:
        condition: service_healthy
    networks: [opendesk]

  # ---------------- Dedicated Redis for Chatwoot (sidekiq + cache) ----------------
  chatwoot-redis:
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    image: redis:7-alpine
    container_name: chatwoot-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - chatwoot-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [opendesk]

