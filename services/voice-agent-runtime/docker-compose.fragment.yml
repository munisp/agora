# Compose fragment for the voice stack (SPEC §3/§11): merge into the root
# infra/docker-compose.yml or run standalone with
#   docker compose -f docker-compose.yml -f services/voice-agent-runtime/docker-compose.fragment.yml --profile voice up
# All services join the `opendesk` network (declared by the root compose).

services:
  ollama:
    image: ollama/ollama:0.3.12
    profiles: ["voice"]
    networks: [opendesk]
    environment:
      # SPEC-W71 P10: keep the model resident — ollama's default 5m
      # idle-unload costs a multi-second model reload on the next call.
      # NUM_PARALLEL bounds concurrent decode slots.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10

  # One-time model pulls (LLM). Runs to completion, then exits.
  ollama-init:
    image: ollama/ollama:0.3.12
    profiles: ["voice"]
    networks: [opendesk]
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "OLLAMA_HOST=http://ollama:11434 ollama pull $${LLM_MODEL:-llama3.1:8b}"
    volumes:
      - ollama-models:/root/.ollama

  piper:
    build:
      context: ./sidecar
    profiles: ["voice"]
    networks: [opendesk]
    environment:
      PIPER_VOICE: ${PIPER_VOICE:-en_US-lessac-medium}
    volumes:
      - piper-voices:/voices
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5500/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5

  # CosyVoice-2 voice-cloning sidecar (SPEC-W72 A2). MOCK DEFAULT here
  # (COSYVOICE_MOCK=1): deterministic sine wav, no GPU, no model download —
  # real CosyVoice-2 inference is GPU-gated (>=8GB VRAM; build the CUDA
  # variant per services/cosyvoice-tts/Dockerfile and set COSYVOICE_MOCK=0).
  # Enrollment is fail-closed on consent_basis (services/cosyvoice-tts).
  cosyvoice-tts:
    build:
      context: ../cosyvoice-tts
    image: opendesk/cosyvoice-tts:dev
    profiles: ["voice"]
    networks: [opendesk]
    environment:
      COSYVOICE_MOCK: ${COSYVOICE_MOCK:-1}
      VOICES_DIR: /data
    volumes:
      - cosyvoice-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5820/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # LongCat-AudioDiT voice-cloning sidecar (SPEC-W102 C1, Meituan, MIT code
  # + weights). MOCK DEFAULT here (LONGCAT_MOCK=1): deterministic per-voice
  # sine wav, no GPU, no model download — real LongCat-AudioDiT inference is
  # GPU-gated (>=8GB VRAM; build the CUDA variant per
  # services/longcat-tts/Dockerfile and set LONGCAT_MOCK=0). Benchmarked
  # ZH+EN ONLY (NOT a Nigerian-language path); zero-shot cloning needs the
  # enrolled sample's transcript (prompt_text) — without it the sidecar
  # honestly falls back to plain TTS. Enrollment is fail-closed on
  # consent_basis (services/longcat-tts).
  longcat-tts:
    build:
      context: ../longcat-tts
    image: opendesk/longcat-tts:dev
    profiles: ["voice"]
    networks: [opendesk]
    environment:
      LONGCAT_MOCK: ${LONGCAT_MOCK:-1}
      VOICES_DIR: /data
    volumes:
      - longcat-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5830/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # voice-corpus (SPEC-W103 C2): commissioned native-speaker corpus
  # registry + QA + training-manifest export — the fine-tune READINESS
  # scaffold (data infrastructure for the CosyVoice-2 Naija-TTS track and
  # any future LongCat spike). Pure data plumbing: no model, no GPU, no mock
  # mode. Deliberately NOT part of the realtime voice path: opt-in profile
  # "corpus", no watchdog target, no worker env — nothing at serving time
  # consumes it. Consent is fail-closed at enrollment (services/voice-corpus).
  voice-corpus:
    build:
      context: ../voice-corpus
    image: opendesk/voice-corpus:dev
    profiles: ["corpus"]
    networks: [opendesk]
    environment:
      CORPUS_DIR: /data
      CORPUS_LANGUAGES: ${CORPUS_LANGUAGES:-pcm,yo,ha,ig,en}
    volumes:
      - voice-corpus-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5840/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Qwen3-TTS GPU-tier TTS server (SPEC-W74 A1, nari-labs/nari-qwen3-tts,
  # Apache-2.0). The published image IS the sidecar — the voice runtime's
  # `qwen3` provider POSTs OpenAI-shaped /v1/audio/speech directly to it.
  # OPT-IN profile "voice-gpu": bring up explicitly with
  #   docker compose ... --profile voice --profile voice-gpu up
  # HARDWARE: requires an NVIDIA H100 (single; SXM tested), NVIDIA Container
  # Toolkit, and a CUDA 13.0-compatible driver — reserve the GPU with
  # `deploy.resources.reservations.devices` (driver: nvidia, count: 1,
  # capabilities: [gpu]) or run with `--gpus all` (commented below because
  # the plain `voice` profile hosts have no GPU). The engine is tested with
  # English as the PRIMARY language only — NOT a Nigerian-language path
  # (docs/voices-sidecars.md). Model files + compiled kernels are cached in
  # the qwen3-cache volume (HF_TOKEN required for the first model pull).
  # NOT added to the voice-watchdog default targets (GPU-tier, opt-in).
  qwen3-tts:
    image: ghcr.io/nari-labs/nari-qwen3-tts:latest
    profiles: ["voice-gpu"]
    networks: [opendesk]
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      # Serving profile: ttfa|balanced|throughput (see docs/voices-sidecars.md).
      QWEN3_TTS_PROFILE: ${QWEN3_TTS_PROFILE:-balanced}
      QWEN3_TTS_MODEL_CACHE_DIR: ${QWEN3_TTS_MODEL_CACHE_DIR:-/home/nari/.cache}
    volumes:
      - qwen3-cache:/home/nari/.cache
    # GPU reservation (uncomment on the H100 host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      # /ready stays false until model load + CUDA-graph capture + warm-up
      # complete — that is SLOW (minutes), hence the long start_period.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s

  # One-time piper voice download (idempotent).
  piper-init:
    build:
      context: ./sidecar
    profiles: ["voice"]
    networks: [opendesk]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "python -m piper.download_voices $${PIPER_VOICE:-en_US-lessac-medium} --download-dir /voices || true; ls /voices"
    volumes:
      - piper-voices:/voices

  voice-agent-runtime:
    build:
      context: .
    image: opendesk/voice-agent-runtime:dev
    profiles: ["voice"]
    networks: [opendesk]
    ports:
      - "7006:7006"
    volumes:
      - whisper-models:/models
    environment:
      PORT: "7006"
      DAPR_HOST: daprd-voice
      DAPR_HTTP_PORT: "3500"
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      # SPEC-W70: latency knobs + optional multilingual STT tier (docs/voice-tuning.md).
      WHISPER_MODEL_MULTILINGUAL: ${WHISPER_MODEL_MULTILINGUAL:-}
      VOICE_MIN_ENDPOINTING_DELAY: ${VOICE_MIN_ENDPOINTING_DELAY:-0.3}
      VOICE_VAD_MIN_SILENCE_S: ${VOICE_VAD_MIN_SILENCE_S:-0.35}
      VOICE_PREEMPTIVE_SYNTHESIS: ${VOICE_PREEMPTIVE_SYNTHESIS:-true}
      # SPEC-W71: STT thread tuning + LLM caps/history window (docs/voice-tuning.md).
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-0}
      WHISPER_NUM_WORKERS: ${WHISPER_NUM_WORKERS:-1}
      VOICE_LLM_MAX_TOKENS: ${VOICE_LLM_MAX_TOKENS:-300}
      VOICE_LLM_HISTORY_MAX: ${VOICE_LLM_HISTORY_MAX:-60}
      PIPER_MODE: http
      PIPER_HTTP_URL: http://piper:5500
      PIPER_VOICE: ${PIPER_VOICE:-en_US-lessac-medium}
      AGENT_BACKEND: ${AGENT_BACKEND:-livekit}
      # VOICE-SCALING: async-tool timeout + LLM fallback chain (P0/P1).
      TOOL_TIMEOUT_SECONDS: ${TOOL_TIMEOUT_SECONDS:-4}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-20}
      LLM_FALLBACK_BASE_URL: ${LLM_FALLBACK_BASE_URL:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      # SPEC-W45 K15: caller verification (OTP via booking portal), admin
      # guard, event phone hashing. Empty token/salt = FAIL CLOSED (mutating
      # tools refuse; /voice-admin/* 503; phones omitted from events).
      BOOKING_URL: ${BOOKING_URL:-http://booking:7002}
      VOICE_BOOKING_INTERNAL_TOKEN: ${VOICE_BOOKING_INTERNAL_TOKEN:-}
      VOICE_ADMIN_INTERNAL_TOKEN: ${VOICE_ADMIN_INTERNAL_TOKEN:-}
      PHONE_HASH_SALT: ${PHONE_HASH_SALT:-}
      # SPEC-W72: CosyVoice-2 sidecar (cosyvoice TTS provider, A2).
      COSYVOICE_TTS_URL: ${COSYVOICE_TTS_URL:-http://cosyvoice-tts:5820}
      # SPEC-W102 C3: LongCat-AudioDiT sidecar (longcat TTS provider).
      LONGCAT_TTS_URL: ${LONGCAT_TTS_URL:-http://longcat-tts:5830}
      # SPEC-W74 A1: Qwen3-TTS GPU-tier provider (opt-in "voice-gpu" profile;
      # add "qwen3" to TTS_PROVIDER_CHAIN only on an H100 host).
      QWEN3_TTS_URL: ${QWEN3_TTS_URL:-http://qwen3-tts:8000}
    depends_on:
      - daprd-voice
      - piper

  # LiveKit Agents worker process (same image, different entrypoint).
  voice-agent-worker:
    image: opendesk/voice-agent-runtime:dev
    profiles: ["voice"]
    networks: [opendesk]
    volumes:
      - whisper-models:/models
    environment:
      DAPR_HOST: daprd-voice
      DAPR_HTTP_PORT: "3500"
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      # SPEC-W70: latency knobs + optional multilingual STT tier (docs/voice-tuning.md).
      WHISPER_MODEL_MULTILINGUAL: ${WHISPER_MODEL_MULTILINGUAL:-}
      VOICE_MIN_ENDPOINTING_DELAY: ${VOICE_MIN_ENDPOINTING_DELAY:-0.3}
      VOICE_VAD_MIN_SILENCE_S: ${VOICE_VAD_MIN_SILENCE_S:-0.35}
      VOICE_PREEMPTIVE_SYNTHESIS: ${VOICE_PREEMPTIVE_SYNTHESIS:-true}
      # SPEC-W71: STT thread tuning + LLM caps/history window (docs/voice-tuning.md).
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-0}
      WHISPER_NUM_WORKERS: ${WHISPER_NUM_WORKERS:-1}
      VOICE_LLM_MAX_TOKENS: ${VOICE_LLM_MAX_TOKENS:-300}
      VOICE_LLM_HISTORY_MAX: ${VOICE_LLM_HISTORY_MAX:-60}
      PIPER_MODE: http
      PIPER_HTTP_URL: http://piper:5500
      PIPER_VOICE: ${PIPER_VOICE:-en_US-lessac-medium}
      AGENT_BACKEND: ${AGENT_BACKEND:-livekit}
      # VOICE-SCALING §2/§5: prewarming + CPU load gating + tool timeouts.
      PRELOAD_MODELS: ${PRELOAD_MODELS:-true}
      AGENT_IDLE_PROCESSES: ${AGENT_IDLE_PROCESSES:-2}
      LOAD_THRESHOLD: ${LOAD_THRESHOLD:-0.7}
      TOOL_TIMEOUT_SECONDS: ${TOOL_TIMEOUT_SECONDS:-4}
      # SPEC-W45 K15: SIP sessions run the same OTP gate for mutating tools
      # (the carrier-asserted bypass was removed); fail closed when unset.
      BOOKING_URL: ${BOOKING_URL:-http://booking:7002}
      VOICE_BOOKING_INTERNAL_TOKEN: ${VOICE_BOOKING_INTERNAL_TOKEN:-}
      PHONE_HASH_SALT: ${PHONE_HASH_SALT:-}
      # SPEC-W72: CosyVoice-2 sidecar (cosyvoice TTS provider, A2).
      COSYVOICE_TTS_URL: ${COSYVOICE_TTS_URL:-http://cosyvoice-tts:5820}
      # SPEC-W102 C3: LongCat-AudioDiT sidecar (longcat TTS provider).
      LONGCAT_TTS_URL: ${LONGCAT_TTS_URL:-http://longcat-tts:5830}
      # SPEC-W74 A1: Qwen3-TTS GPU-tier provider (opt-in "voice-gpu" profile;
      # add "qwen3" to TTS_PROVIDER_CHAIN only on an H100 host).
      QWEN3_TTS_URL: ${QWEN3_TTS_URL:-http://qwen3-tts:8000}
    command: ["python", "-m", "app.livekit_worker", "start"]
    depends_on:
      - daprd-voice
      - piper

  # Model-server watchdog (SPEC-W73 WS-B B2/B3). OPT-IN profile
  # "voice-watchdog". Probes REAL inference on the TTS/LLM sidecars
  # (/healthz can lie: minimal POST /tts or /speak per target, a 1-token
  # generate for ollama) and, after VOICE_WATCHDOG_FAIL_THRESHOLD
  # CONSECUTIVE failures, restarts the container through the mounted docker
  # socket. SAFETY: VOICE_WATCHDOG_DRY_RUN defaults to 1 = log-only, NEVER
  # restarts — soak it dry, then arm with 0 (see docs/voice-ops.md). The
  # voice-agent-runtime/worker containers are never eligible restart
  # targets. Runs from the runtime image (httpx already installed).
  voice-watchdog:
    image: opendesk/voice-agent-runtime:dev
    profiles: ["voice-watchdog"]
    networks: [opendesk]
    command: ["python", "/ops/voice_watchdog.py"]
    volumes:
      - ./ops:/ops:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      VOICE_WATCHDOG_TARGETS: ${VOICE_WATCHDOG_TARGETS:-piper=http://piper:5500,mms=http://mms-tts:5800,xtts=http://xtts-tts:5810,cosyvoice=http://cosyvoice-tts:5820,longcat=http://longcat-tts:5830,ollama=http://ollama:11434}
      VOICE_WATCHDOG_INTERVAL_S: ${VOICE_WATCHDOG_INTERVAL_S:-30}
      VOICE_WATCHDOG_FAIL_THRESHOLD: ${VOICE_WATCHDOG_FAIL_THRESHOLD:-3}
      VOICE_WATCHDOG_PROBE_TIMEOUT_S: ${VOICE_WATCHDOG_PROBE_TIMEOUT_S:-10}
      VOICE_WATCHDOG_DRY_RUN: ${VOICE_WATCHDOG_DRY_RUN:-1}
      PIPER_VOICE: ${PIPER_VOICE:-en_US-lessac-medium}
      LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
    depends_on:
      - piper
      - ollama
      - cosyvoice-tts
      - longcat-tts
    restart: unless-stopped

  # Dapr sidecar companion (SPEC §3: app talks to daprd-voice:3500).
  daprd-voice:
    image: daprio/daprd:1.14.4
    profiles: ["voice"]
    networks: [opendesk]
    command:
      - "./daprd"
      - "-app-id"
      - "voice"
      - "-app-port"
      - "7006"
      - "-dapr-http-port"
      - "3500"
      - "-components-path"
      - "/components"
      - "-log-level"
      - "warn"
    volumes:
      - "../../infra/dapr/components:/components:ro"

volumes:
  ollama-models:
  piper-voices:
  whisper-models:
  cosyvoice-data:
  longcat-data:
  voice-corpus-data:
  qwen3-cache:

networks:
  # Matches the declaration in infra/docker-compose.core.yml so the fragment
  # merges cleanly with the root compose files.
  opendesk:
    driver: bridge
