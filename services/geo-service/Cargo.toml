[package]
name = "geo-service"
version = "0.1.0"
edition = "2021"
description = "OpenDesk geo-service: terrio-based boundary ingest, point-in-polygon enrichment, and self-hosted PMTiles tile/style serving (SPEC-W52 Scope A)"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Shared outbound HTTP client idiom (payments RS-006): rustls, explicit
# timeouts at the call sites. `stream` for the capped {url} import download.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
# Runtime queries only (no sqlx macros), so no compile-time DATABASE_URL.
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
tempfile = "3"
# SPEC-W52: terrio (pure-Rust geospatial I/O) pinned EXACTLY. default-features
# off; the only opt-in feature is `tiles` (PMTiles/MBTiles/MVT reading; pulls
# the `sqlite` GeoPackage reader). GeoJSON/Shapefile/zip-archive vector
# ingest, the CRS engine (EPSG reprojection) and WKB encoding are always
# built, so this is the minimal feature set for boundary ingest + tile
# serving. Remote I/O (URLs/object storage) stays OFF: {url} imports are
# fetched by reqwest (capped) and handed to terrio as local temp files.
terrio = { version = "=0.8.0", default-features = false, features = ["tiles"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tower = { version = "0.4", features = ["util"] }

# terrio 0.8 is a very large crate; the default dev profile (debuginfo=2)
# OOMs rustc on the CI sandbox. debug=0 keeps `cargo test` buildable; test
# behavior is unchanged.
[profile.dev]
debug = 0
