[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opendesk-chatwoot-bridge"
version = "0.1.0"
description = "OpenDesk chatwoot-bridge: bidirectional sync between conversation-service transcripts and self-hosted Chatwoot (human-agent console)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "httpx==0.27.2",
    "asyncpg==0.29.0",
    "aiokafka==0.10.0",
    "structlog==24.4.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "prometheus-client==0.21.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "ruff==0.8.4",
    # Embedded Postgres 16 for the RLS tests (tests/test_store_rls.py).
    "pgserver==0.1.4",
]

[tool.setuptools.packages.find]
include = ["app*"]
