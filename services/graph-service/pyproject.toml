[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opendesk-graph-service"
version = "0.1.0"
description = "OpenDesk graph-service: tenant-scoped consent-gated read API over FalkorDB (SPEC-W28 WS-B)."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.9.2",
    "structlog==24.4.0",
    "prometheus-client==0.21.1",
    # Graph store (imported lazily so tests/dev run without a live driver).
    "falkordb==1.1.0",
    # NL->Cypher via Ollama's OpenAI-compatible API (imported lazily).
    "openai==1.59.6",
    # RS256/ES256 JWT verification (HS256 is stdlib-only).
    "cryptography==44.0.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-asyncio==0.24.0", "httpx==0.27.2"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
