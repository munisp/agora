[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opendesk-avatar-renderer"
version = "0.1.0"
description = "OpenDesk avatar renderer sidecar: LiveKit worker publishing a generated avatar video track (SPEC-W9 Part A / A3)"
requires-python = ">=3.11"
dependencies = [
    # Version family mirrors the Dockerfile install block and the
    # voice-agent-runtime constraint family (livekit-api 0.6.x).
    "livekit-api>=0.6,<0.7",
    "livekit>=0.17,<1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-asyncio==0.24.0"]

[tool.setuptools.packages.find]
include = ["app*"]
