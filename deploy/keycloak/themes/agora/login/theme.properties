# Agora login theme: keycloak.v2's pages and behaviour, with Agora's look (apps/admin-web sign-in page) over the top.
# Select it per realm: Realm settings -> Themes -> Login theme = agora. Keycloak is shared; only realms that select
# it change. Installed like the OAK theme (copied into keycloak-0's themes dir): re-copy after the pod is recreated.
parent=keycloak.v2
darkMode=false
# Bump the number in the CSS file's name on every change: Cloudflare caches theme files by path for 30 days.
styles=css/styles.css css/agora-login-2.css
