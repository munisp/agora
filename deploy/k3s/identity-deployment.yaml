# Representative app Deployment for the k3s edge appliance.
# Image name matches the compose build output (project "opendesk" + service
# name). Retag/push to a registry reachable from the appliance, or build
# directly into the k3s containerd (see README).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  namespace: opendesk
  labels:
    app: identity
    app.kubernetes.io/part-of: opendesk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity
  template:
    metadata:
      labels:
        app: identity
    spec:
      # GF12 (SPEC-W34) zero-trust baseline: non-root, read-only root fs,
      # no privilege escalation, all capabilities dropped (see booking).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: identity
          image: opendesk-identity:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 7001
          env:
            - name: PORT
              value: "7001"
            - name: PG_DSN
              value: postgres://opendesk:opendesk@postgres:5432
            - name: PG_DATABASE
              value: identity
            - name: DATABASE_URL
              value: postgres://opendesk:opendesk@postgres:5432/identity
            - name: KAFKA_BROKERS
              value: kafka:9092
            - name: REDIS_ADDR
              value: redis:6379
            - name: KEYCLOAK_URL
              value: http://keycloak:8080
            # SPEC-W44 F16-2/F16-3: code reads PERMIFY_URL / TEMPORAL_HOST_PORT
            # (identity config.go); the old names were never read.
            - name: PERMIFY_URL
              value: http://permify:3476
            - name: TEMPORAL_HOST_PORT
              value: temporal:7233
            - name: TEMPORAL_NAMESPACE
              value: opendesk
            - name: TEMPORAL_TASK_QUEUE
              value: opendesk-main
            - name: INDUSTRIES_DIR
              value: /industries
            # SPEC-W44 K2: X-Internal-Token gate on /internal/* (503
            # fail-closed when unset). Dev placeholder from secret.yaml.
            - name: IDENTITY_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: opendesk-db
                  key: identity-internal-token
            # SPEC-W44 K2 caller side: the dev onboarding/twin-cleanup
            # triggers invoke notification-worker /dev/* with
            # X-Internal-Token; must match NOTIFICATION_INTERNAL_TOKEN.
            - name: NOTIFICATION_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: opendesk-db
                  key: notification-internal-token
            # DAPR_HOST/PORTS are set per-pod when the dapr sidecar is
            # injected; the edge MVP runs without dapr (see README "Dapr gap",
            # SPEC-W44 F16-9). To enable once the Dapr control plane is
            # installed, add to the pod template annotations:
            #   dapr.io/enabled: "true"
            #   dapr.io/app-id: "identity"
            #   dapr.io/app-port: "7001"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 7001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 7001
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: identity
  namespace: opendesk
spec:
  selector:
    app: identity
  ports:
    - port: 7001
      targetPort: 7001
