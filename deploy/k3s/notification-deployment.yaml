# Representative app Deployment for the k3s edge appliance (see
# identity-deployment.yaml header for image-name convention).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  namespace: opendesk
  labels:
    app: notification
    app.kubernetes.io/part-of: opendesk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
      # SPEC-W44 F16-9: NO Dapr sidecar in this base (see README "Dapr gap").
      # notification-worker code defaults DAPR_HOST=daprd-notification; its
      # Dapr binding/invoke paths (messaging sends, saga activities) fail
      # without one. With the Dapr control plane installed, uncomment:
      # annotations:
      #   dapr.io/enabled: "true"
      #   dapr.io/app-id: "notification"
      #   dapr.io/app-port: "7003"
    spec:
      # GF12 (SPEC-W34) zero-trust baseline: non-root, read-only root fs,
      # no privilege escalation, all capabilities dropped (see booking).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notification
          image: opendesk-notification:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 7003
          env:
            - name: PORT
              value: "7003"
            # SPEC-W44 F16: code reads DATABASE_URL incl. dbname; PG_DSN was
            # never read. TODO(prod): move to secretKeyRef like the token envs.
            - name: DATABASE_URL
              value: postgres://opendesk:opendesk@postgres:5432/notifications
            - name: KAFKA_BROKERS
              value: kafka:9092
            - name: REDIS_ADDR
              value: redis:6379
            # SPEC-W44 F16-3: code reads TEMPORAL_HOST_PORT (notification
            # config.go); the old TEMPORAL_ADDRESS name was never read.
            - name: TEMPORAL_HOST_PORT
              value: temporal:7233
            - name: TEMPORAL_NAMESPACE
              value: opendesk
            - name: TEMPORAL_TASK_QUEUE
              value: opendesk-main
            # SPEC-W44 K2: X-Internal-Token gate on signals + /internal/*
            # (503 fail-closed when unset). Dev placeholder from secret.yaml.
            - name: NOTIFICATION_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: opendesk-db
                  key: notification-internal-token
            # SPEC-W44 K2 caller side: outbound gated calls (payments
            # hold-deposit/void, identity tenant delete, booking
            # activities) send X-Internal-Token with these values; each must
            # match the target's server-side token (secret.yaml).
            - name: PAYMENTS_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: opendesk-db
                  key: payments-internal-token
            - name: IDENTITY_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: opendesk-db
                  key: identity-internal-token
            - name: BOOKING_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: opendesk-db
                  key: booking-internal-token
          readinessProbe:
            httpGet:
              path: /healthz
              port: 7003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 7003
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: notification
  namespace: opendesk
spec:
  selector:
    app: notification
  ports:
    - port: 7003
      targetPort: 7003
