# Representative app Deployment for the k3s edge appliance (see
# identity-deployment.yaml header for image-name convention).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking
  namespace: opendesk
  labels:
    app: booking
    app.kubernetes.io/part-of: opendesk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking
  template:
    metadata:
      labels:
        app: booking
      # SPEC-W44 F16-9: NO Dapr sidecar in this base (see README "Dapr gap").
      # booking code defaults DAPR_HOST=daprd-booking; without a sidecar any
      # Dapr invoke path fails. When the Dapr control plane is installed on
      # the appliance, uncomment to inject the sidecar:
      # annotations:
      #   dapr.io/enabled: "true"
      #   dapr.io/app-id: "booking"
      #   dapr.io/app-port: "7002"
    spec:
      # GF12 (SPEC-W34) zero-trust baseline: non-root, read-only root fs,
      # no privilege escalation, all capabilities dropped. Writable scratch
      # space comes from the emptyDir /tmp mount below.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: booking
          image: opendesk-booking:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 7002
          env:
            - name: PORT
              value: "7002"
            # GF12: DSNs carry the DB password - sourced from the dev-only
            # Secret (secret.yaml), no longer plaintext in the Deployment.
            - name: PG_DSN
              valueFrom:
                secretKeyRef:
                  name: opendesk-db
                  key: pg-dsn
            - name: PG_DATABASE
              value: booking
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: opendesk-db
                  key: booking-database-url
            # pgxpool MaxConns — size for PEAK concurrent calls, not average
            # (voice turns fan out into availability lookups). Formula and
            # per-service defaults: docs/runbooks/capacity-planning.md §DB.
            - name: PG_MAX_CONNS
              value: "20"
            - name: KAFKA_BROKERS
              value: kafka:9092
            - name: REDIS_ADDR
              value: redis:6379
            # SPEC-W44 F16-2/F16-3: env names match what the code reads
            # (booking config.go): TEMPORAL_HOST_PORT and PERMIFY_URL. The
            # old TEMPORAL_ADDRESS/PERMIFY_HTTP names were never read.
            - name: TEMPORAL_HOST_PORT
              value: temporal:7233
            - name: TEMPORAL_NAMESPACE
              value: opendesk
            - name: TEMPORAL_TASK_QUEUE
              value: opendesk-main
            - name: PERMIFY_URL
              value: http://permify:3476
            # SPEC-W44 K2: X-Internal-Token gate on /internal/* + /activities/*
            # (503 fail-closed when unset). Dev placeholder from secret.yaml.
            - name: BOOKING_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: opendesk-db
                  key: booking-internal-token
            # SPEC-W44 K2 caller side: identity tenant-resolution calls
            # (appgate/resolver) send X-Internal-Token with this value; must
            # match identity's IDENTITY_INTERNAL_TOKEN (secret.yaml).
            - name: IDENTITY_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: opendesk-db
                  key: identity-internal-token
            # GF12: AUTHZ_DISABLED removed (was "true" here, disabling Permify
            # checks cluster-wide). The service default is "false"
            # (internal/config/config.go) - authorization stays enforced.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 7002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 7002
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: booking
  namespace: opendesk
spec:
  selector:
    app: booking
  ports:
    - port: 7002
      targetPort: 7002
