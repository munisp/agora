# GF12 (SPEC-W34): dev-only database credentials for the k3s edge appliance.
#
# ⚠ DEV ONLY — the values below are the well-known compose dev credentials
# (opendesk/opendesk). They exist so `kustomize build | kubectl apply` works on
# a throwaway appliance. Before any real deployment replace them via your
# secrets manager (SOPS/SealedSecrets/ESO) and rotate the DB role passwords;
# see docs/runbooks/secrets.md. Do NOT commit real values here.
apiVersion: v1
kind: Secret
metadata:
  name: opendesk-db
  namespace: opendesk
  labels:
    app.kubernetes.io/part-of: opendesk
type: Opaque
stringData:
  # Shared cluster DSN (services append their own DB name via PG_DATABASE).
  pg-dsn: postgres://opendesk:opendesk@postgres:5432
  # booking-service full DSN (consumed via DATABASE_URL).
  booking-database-url: postgres://opendesk:opendesk@postgres:5432/booking
